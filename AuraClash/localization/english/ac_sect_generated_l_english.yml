 ac_sect_job.0003.t:0 "The Missing Scripture"
 ac_sect_job.0003.desc:0 "My inquiries in [ac_mission_contract.GetLocation.GetName] lead to a dealer who insists the missing scripture is an innocent purchase. His locked storeroom may hold the original, but a public accusation will warn him."
 ac_sect_job.0003.careful:0 "Watch the dealer and trace his suppliers."
 ac_sect_job.0003.expert:0 "Confront him and demand the scripture."
 ac_sect_job.0003.cultivation:0 "Use Kurokonton to enter the storeroom unseen."
