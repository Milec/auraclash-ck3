 ac_sect_build_cultivation_hall:0 "Improve the Cultivation Hall"
 ac_sect_build_cultivation_hall_tt:0 "Quiet chambers for meditation and core advancement. Annual cultivation lifestyle experience: 20 per level. Costs 100/200/300 sect gold. Base construction time: 180 days."
 ac_sect_build_alchemy_pavilion:0 "Improve the Alchemy Pavilion"
 ac_sect_build_alchemy_pavilion_tt:0 "Furnaces, laboratories, and apprentices prepare cultivation medicines. Unlocks medicinal pills in the sect exchange. Costs 100/200/300 sect gold. Base construction time: 180 days."
 ac_sect_build_training_ground:0 "Improve the Martial Training Ground"
 ac_sect_build_training_ground_tt:0 "Disciples drill footwork, weapon forms, and unarmed techniques. Annual Power Core experience: 1 per level; strengthens sect battle formations. Costs 100/200/300 sect gold. Base construction time: 180 days."
 ac_sect_build_scripture_library:0 "Improve the Scripture Library"
 ac_sect_build_scripture_library_tt:0 "The sect preserves manuals, examination records, and its martial lineage. Annual cultivation lifestyle experience: 20 per level; unlocks manual study. Costs 100/200/300 sect gold. Base construction time: 180 days."
 ac_sect_build_spirit_garden:0 "Improve the Spirit Garden"
 ac_sect_build_spirit_garden_tt:0 "Cultivated medicinal herbs sustain the alchemy pavilion. Annual Fortitude Core experience: 1 per level. Costs 100/200/300 sect gold. Base construction time: 180 days."
 ac_sect_build_formation_hall:0 "Improve the Formation Hall"
 ac_sect_build_formation_hall_tt:0 "Disciples study how to combine their elements in coordinated battle. Annual Agility Core experience: 1 per level; strengthens sect battle formations. Costs 100/200/300 sect gold. Base construction time: 180 days."
 ac_sect_job.0001.t:0 "Brigands on the Sect Roads"
 ac_sect_job.0001.desc:0 "The merchants were right: a barricade blocks the road at [ac_mission_contract.GetLocation.GetName]. Armed men watch the wagons from the trees. I must clear the route without leaving the travellers exposed."
 ac_sect_job.0001.careful:0 "Scout their positions before advancing."
 ac_sect_job.0001.expert:0 "Strike at the barricade before they can scatter."
 ac_sect_job.0001.cultivation:0 "Break their line with my martial cultivation."
 ac_sect_patrol:0 "Patrol the Sect Roads"
 ac_sect_patrol_contract:0 "Patrol the Sect Roads"
 ac_sect_patrol_desc:0 "Escort merchants and drive brigands away from the headquarters."
 ac_sect_patrol_desc_title:0 "Patrol the Sect Roads"
