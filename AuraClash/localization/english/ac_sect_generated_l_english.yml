 ac_sect_job.0006.t:0 "The Delegation at the Crossing"
 ac_sect_job.0006.desc:0 "The sect delegation has reached [ac_mission_contract.GetLocation.GetName], where a narrow crossing leaves the tribute exposed. Riders have been following us. I must bring the envoys and their correspondence through safely."
 ac_sect_job.0006.careful:0 "Secure the crossing and arrange a protective formation."
 ac_sect_job.0006.expert:0 "Lead the delegation across before the riders arrive."
 ac_sect_job.0006.cultivation:0 "Use Kiihakai or Midorikatai to shield the delegation."
