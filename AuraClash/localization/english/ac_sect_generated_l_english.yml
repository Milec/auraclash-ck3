 ac_sect_job.0002.t:0 "The Hidden Harvest"
 ac_sect_job.0002.desc:0 "The medicinal plants grow above a treacherous stream at [ac_mission_contract.GetLocation.GetName]. A hurried harvest could destroy the roots or spoil the medicine. The pavilion needs living, usable specimens."
 ac_sect_job.0002.careful:0 "Identify the mature plants and prepare containers."
 ac_sect_job.0002.expert:0 "Climb down and harvest before the weather turns."
 ac_sect_job.0002.cultivation:0 "Guide water and earth around the fragile roots."
