 ac_sect_job.0004.t:0 "Two Houses, One Grievance"
 ac_sect_job.0004.desc:0 "The feuding households at [ac_mission_contract.GetLocation.GetName] have finally agreed to hear the sect's representative. Each brings witnesses, accusations, and a different account of the same boundary."
 ac_sect_job.0004.careful:0 "Hear both accounts and examine the boundary."
 ac_sect_job.0004.expert:0 "Propose a settlement before the argument worsens."
 ac_sect_job.0004.cultivation:0 "Use Aoyusumu to understand the words left unspoken."
