 ac_sect_job.0005.t:0 "A Village in Need"
 ac_sect_job.0005.desc:0 "At [ac_mission_contract.GetLocation.GetName], damaged stores and sickness threaten the coming season. I can organize what remains, but the villagers need a workable recovery, not promises."
 ac_sect_job.0005.careful:0 "Inventory the supplies and organize their distribution."
 ac_sect_job.0005.expert:0 "Put every available hand to work immediately."
 ac_sect_job.0005.cultivation:0 "Restore clean water and tend the sick through cultivation."
