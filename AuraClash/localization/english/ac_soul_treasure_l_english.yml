l_english:
 ac_beast.0001.t:0 "Hunting Spirit Beasts"
 ac_beast.0001.desc:0 "Beasts saturated with chi roam the wilds, and a slain one leaves behind a Soul Treasure holding its Aura Pressure. The stronger the beast compared with you, the greater the treasure, and the greater the danger.\n\nMy Aura Pressure: #V [ROOT.Char.MakeScope.ScriptValue('ac_aura_pressure_value')|0]#!. Power and Agility Cores decide the hunt."
 ac_beast.slain:0 "The beast falls"
 ac_beast.escaped:0 "The beast mauls you and escapes"
 ac_beast.0001.leave:0 "Not today"
 ac_beast.0010.t:0 "Refining a Soul Treasure"
 ac_beast.0010.desc:0 "Refining the Treasure into an Advancement Elixir is not pretty. Grind it to dust, mix the reagents, boil the solvents, and imbue your own Chi into the vial. The elixir pushes your spirit's limits by 11% of the treasure's Aura Pressure above your own, between #V [ROOT.Char.MakeScope.ScriptValue('ac_alchemy_rank')|0]#!×3+10 and 100. With four Alchemy perks, the elixir ignores Mortal Limits.\n\nMy Aura Pressure: #V [ROOT.Char.MakeScope.ScriptValue('ac_aura_pressure_value')|0]#!."
 ac_beast.0010.leave:0 "Keep them for now"
 ac_soul_treasure_gained_tt:0 "Gain a #V Soul Treasure#! (refine it through #V Refine a Soul Treasure#!)."
 ac_soul_treasure_sold_tt:0 "Your three treasure slots are full; the Soul Treasure is sold for a tenth of its Aura Pressure in [gold|E]."
 ac_elixir_ignores_limits_tt:0 "Alchemy 4: the elixir ignores Mortal Limits."
 ac_elixir_limited_tt:0 "The elixir is halved above your Mortal Limit and quartered above 1.5 times it."
 ac_hunt_spirit_beast_decision:0 "Hunt a Spirit Beast"
 ac_hunt_spirit_beast_decision_desc:0 "Track a beast saturated with chi and take its Soul Treasure."
 ac_hunt_spirit_beast_decision_tooltip:0 "Choose a Spirit Beast to hunt. Victory yields a Soul Treasure holding its Aura Pressure, some Aura Pressure and Power Core progress; defeat leaves you wounded. Once per year."
 ac_hunt_spirit_beast_decision_confirm:0 "Begin the hunt"
 ac_buy_soul_treasure_decision:0 "Buy a Fishbone Soul Treasure"
 ac_buy_soul_treasure_decision_desc:0 "Market stalls sell weak Soul Treasures to those who cannot hunt their own."
 ac_buy_soul_treasure_decision_tooltip:0 "Spend #V 75#! [gold|E] on a fishbone Soul Treasure (300 Aura Pressure). Once per year."
 ac_buy_soul_treasure_decision_confirm:0 "Buy it"
 ac_refine_soul_treasure_decision:0 "Refine a Soul Treasure"
 ac_refine_soul_treasure_decision_desc:0 "Refine a Soul Treasure into an Advancement Elixir and drink it."
 ac_refine_soul_treasure_decision_tooltip:0 "Choose one of your Soul Treasures to refine into Aura Pressure."
 ac_refine_soul_treasure_decision_confirm:0 "Light the furnace"
 ac_beast.0001.sabretooth:0 "Hunt a Sabretooth (600 AP; success #V [ROOT.Char.MakeScope.ScriptValue('ac_beast_sabretooth_chance')|0]%#!)"
 ac_beast.0001.quadrafang:0 "Hunt a Quadrafang (900 AP; success #V [ROOT.Char.MakeScope.ScriptValue('ac_beast_quadrafang_chance')|0]%#!)"
 ac_beast.0001.mawcharger:0 "Hunt a Mawcharger (1,300 AP; success #V [ROOT.Char.MakeScope.ScriptValue('ac_beast_mawcharger_chance')|0]%#!)"
 ac_beast.0001.shakengara:0 "Hunt a Shakengara (1,800 AP; success #V [ROOT.Char.MakeScope.ScriptValue('ac_beast_shakengara_chance')|0]%#!)"
 ac_beast.0001.drake:0 "Hunt a Drake (2,200 AP; success #V [ROOT.Char.MakeScope.ScriptValue('ac_beast_drake_chance')|0]%#!)"
 ac_beast.0001.wyrm:0 "Hunt a Wyrm (3,000 AP; success #V [ROOT.Char.MakeScope.ScriptValue('ac_beast_wyrm_chance')|0]%#!)"
 ac_beast.0010.refine_1:0 "Refine the treasure of #V [ROOT.Char.MakeScope.ScriptValue('ac_soul_treasure_1_value')|0]#! AP (elixir: #V [ROOT.Char.MakeScope.ScriptValue('ac_soul_treasure_1_elixir')|0]#! AP)"
 ac_beast.0010.refine_2:0 "Refine the treasure of #V [ROOT.Char.MakeScope.ScriptValue('ac_soul_treasure_2_value')|0]#! AP (elixir: #V [ROOT.Char.MakeScope.ScriptValue('ac_soul_treasure_2_elixir')|0]#! AP)"
 ac_beast.0010.refine_3:0 "Refine the treasure of #V [ROOT.Char.MakeScope.ScriptValue('ac_soul_treasure_3_value')|0]#! AP (elixir: #V [ROOT.Char.MakeScope.ScriptValue('ac_soul_treasure_3_elixir')|0]#! AP)"
