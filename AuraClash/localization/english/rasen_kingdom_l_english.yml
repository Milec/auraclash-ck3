l_english:
 rasen_samurai_decision:0 "Summon the Samurai"
 rasen_samurai_decision_desc:0 "The Samurai of the Bladed Lands answer to the Shogun alone. In war I may call them from their halls."
 rasen_samurai_decision_tooltip:0 "Raise the Samurai as an army at my capital"
 rasen_samurai_decision_confirm:0 "Call them to the banner"
 rasen_crusade_decision:0 "Call a Crusade"
 rasen_crusade_decision_desc:0 "The Saints rarely march, but every pious warrior from here to Shattered Cathay will answer the Sacred Lands when they call."
 rasen_crusade_decision_tooltip:0 "Summon pious warriors as an army at my capital"
 rasen_crusade_decision_confirm:0 "Let the call go out"
 rasen_library_decision:0 "Open the Forbidden Library"
 rasen_library_decision_desc:0 "The Mystic Lands keep things behind sealed doors that the world should not see. In dire times those doors can be opened."
 rasen_library_decision_tooltip:0 "For five years: +4 Learning, stronger champions and +6 Advantage, at a cost in stress and dread"
 rasen_library_decision_confirm:0 "Break the seals"
 rasen_shinobi_decision:0 "Loose the Shinobi Clans"
 rasen_shinobi_decision_desc:0 "The Clans that rule the Cursed Lands from the shadows can be turned outward, for a price."
 rasen_shinobi_decision_tooltip:0 "For five years: +4 Intrigue, faster hostile schemes and safer from enemy plots"
 rasen_shinobi_decision_confirm:0 "Pay the Clans"
 rasen_samurai_army:0 "The Samurai"
 rasen_crusade_army:0 "The Crusade"
 rasen_crusade_modifier:0 "Crusade Called"
 rasen_crusade_modifier_desc:0 "Pious warriors have answered the Sacred Lands."
 rasen_forbidden_library_modifier:0 "The Forbidden Library Opened"
 rasen_forbidden_library_modifier_desc:0 "Seals the world should not see are in use."
 rasen_shinobi_clans_modifier:0 "Shinobi Clans Loosed"
 rasen_shinobi_clans_modifier_desc:0 "The Clans work openly for their lord."
