 ac_duel.0001.transform_limitbreaker:0 "Freestyle Transformation: Limitbreaker!!"
 ac_duel_transform_limitbreaker_tt:0 "Transform for the rest of the Clash, for 1 Chi: +1 Power, +1 Vitality (+2 to the roll per Core point), and an Aura Pressure boost. Every Core Surge +1. +10 Aura Pressure from battle victories."
 ac_duel.0001.tf_limitbreaker:0 "\n\n#V I am transformed: Limitbreaker.#!"
 ac_duel.0001.foe_tf_limitbreaker:0 "\n#N [ac_duel_foe.GetFirstName] is transformed: Limitbreaker.#!"
 ac_duel.0001.transform_reaper:0 "Bladed Transformation: Reaper!!"
 ac_duel_transform_reaper_tt:0 "Transform for the rest of the Clash, for 1 Chi: +2 Power, +1 Agility, +1 Vitality (+2 to the roll per Core point), and an Aura Pressure boost. Doubled bonuses from a bladed weapon."
 ac_duel.0001.tf_reaper:0 "\n\n#V I am transformed: Reaper.#!"
 ac_duel.0001.foe_tf_reaper:0 "\n#N [ac_duel_foe.GetFirstName] is transformed: Reaper.#!"
 ac_duel.0001.transform_godhand:0 "Aoyusumu Transformation: Godhand!!"
 ac_duel_transform_godhand_tt:0 "Transform for the rest of the Clash, for 1 Chi: +1 Soul, +1 Agility, +1 Fortitude, +1 Vitality, +1 Chi (+2 to the roll per Core point), and an Aura Pressure boost. Heals to full Vitality upon transforming."
 ac_duel.0001.tf_godhand:0 "\n\n#V I am transformed: Godhand.#!"
 ac_duel.0001.foe_tf_godhand:0 "\n#N [ac_duel_foe.GetFirstName] is transformed: Godhand.#!"
 ac_duel.0001.transform_soul_domain:0 "Kiihakai Transformation: Soul Domain!!"
 ac_duel_transform_soul_domain_tt:0 "Transform for the rest of the Clash, for 1 Chi: +2 Soul, +1 Power, +2 Chi (+2 to the roll per Core point), and an Aura Pressure boost. All attack types are Focused within the Soul Domain (+1 to every roll)."
 ac_duel.0001.tf_soul_domain:0 "\n\n#V I am transformed: Soul Domain.#!"
 ac_duel.0001.foe_tf_soul_domain:0 "\n#N [ac_duel_foe.GetFirstName] is transformed: Soul Domain.#!"
 ac_duel.0001.transform_malocchio:0 "Kurokonton Transformation: Malocchio!!"
 ac_duel_transform_malocchio_tt:0 "Transform for the rest of the Clash, for 1 Chi: +2 Agility, +1 Fortitude, +1 Chi (+2 to the roll per Core point), and an Aura Pressure boost. Technique Copy: a victory teaches a Technique of the foe's."
 ac_duel.0001.tf_malocchio:0 "\n\n#V I am transformed: Malocchio.#!"
 ac_duel.0001.foe_tf_malocchio:0 "\n#N [ac_duel_foe.GetFirstName] is transformed: Malocchio.#!"
 ac_duel.0001.transform_titan:0 "Midorikatai Transformation: Titan!!"
 ac_duel_transform_titan_tt:0 "Transform for the rest of the Clash, for 1 Chi: +2 Fortitude, +1 Power, +2 Vitality (+2 to the roll per Core point), and an Aura Pressure boost. Always deals bonus damage (+1 on every hit)."
 ac_duel.0001.tf_titan:0 "\n\n#V I am transformed: Titan.#!"
 ac_duel.0001.foe_tf_titan:0 "\n#N [ac_duel_foe.GetFirstName] is transformed: Titan.#!"
 ac_duel.0001.transform_asura:0 "Midorikatai Transformation: Asura!!"
 ac_duel_transform_asura_tt:0 "Transform for the rest of the Clash, for 1 Chi: +2 Power, +1 Fortitude, +1 Vitality (+2 to the roll per Core point), and an Aura Pressure boost. Melee attacks are always Focused (+1 to Power Strike, Iron Guard and Flash Step)."
 ac_duel.0001.tf_asura:0 "\n\n#V I am transformed: Asura.#!"
 ac_duel.0001.foe_tf_asura:0 "\n#N [ac_duel_foe.GetFirstName] is transformed: Asura.#!"
 ac_duel.0001.soulsoak:0 "Release my Soulsoak Imbuement"
 ac_duel_soulsoak_tt:0 "Release a charge infused into my blade: +3 to my next roll."
 ac_duel.0001.strike:0 "Power Strike"
 ac_duel_strike_tt:0 "Roll with #V Power#!: 2 x rating + Prowess / 4 + Power Techniques (max 3) + d6. Counters Iron Guard (+2)."
 ac_duel.0001.foe_strike:0 " [ac_duel_foe.GetFirstName] answered with #V Power Strike#!."
 ac_duel.0001.guard:0 "Iron Guard"
 ac_duel_guard_tt:0 "Roll with #V Fortitude#!. Take 1 less damage; if I win, recover 1 Vitality instead of striking. Counters Chi Blast (+2)."
 ac_duel.0001.foe_guard:0 " [ac_duel_foe.GetFirstName] answered with #V Iron Guard#!."
 ac_duel.0001.step:0 "Flash Step"
 ac_duel_step_tt:0 "Roll with #V Agility#!. Counters Power Strike (+2)."
 ac_duel.0001.foe_step:0 " [ac_duel_foe.GetFirstName] answered with #V Flash Step#!."
 ac_duel.0001.blast:0 "Chi Blast"
 ac_duel_blast_tt:0 "Roll with #V Soul#! +1, spending 1 Chi. Counters Flash Step (+2)."
 ac_duel.0001.foe_blast:0 " [ac_duel_foe.GetFirstName] answered with #V Chi Blast#!."
