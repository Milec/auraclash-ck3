l_english:
 ac_challenge_duel_interaction:0 "Challenge to a Clash"
 ac_challenge_duel_interaction_desc:0 "Challenge [recipient.GetShortUIName] to a Clash of Auras, a duel fought round by round through the Cores."
 ac_duel_lethal_option:0 "To the death"
 ac_duel_ai_stronger_reason:0 "Confident in their strength"
 ac_duel_ai_brave_reason:0 "Brave"
 ac_duel_ai_craven_reason:0 "Craven"
 ac_duel_ai_wrathful_reason:0 "Wrathful"
 ac_duel_ai_weaker_reason:0 "Outmatched"
 ac_duel_ai_lethal_reason:0 "A duel to the death"
 ac_duel.0001.t:0 "Clash of Auras"
 ac_duel.0001.status:0 "#bold Round [ROOT.Char.MakeScope.Var('ac_duel_round').GetValue|0]#!  My Vitality: #V [ROOT.Char.MakeScope.Var('ac_duel_vitality').GetValue|0]#!  [ac_duel_foe.GetFirstName]'s Vitality: #V [ac_duel_foe.MakeScope.Var('ac_duel_vitality').GetValue|0]#!\n\n"
 ac_duel.0001.opening:0 "[ac_duel_foe.GetFirstName] and I face each other, auras flaring. Every exchange will be fought through a Core: Power breaks a guard, Agility outpaces brute force, Soul blasts catch the evasive, and Fortitude absorbs chi."
 ac_duel.0001.won:0 "I won the last exchange (#V [ROOT.Char.MakeScope.Var('ac_duel_roll').GetValue|0]#! against [ac_duel_foe.MakeScope.Var('ac_duel_roll').GetValue|0]), dealing #V [ROOT.Char.MakeScope.Var('ac_duel_dealt').GetValue|0]#! damage."
 ac_duel.0001.lost:0 "[ac_duel_foe.GetFirstName] won the last exchange (#N [ac_duel_foe.MakeScope.Var('ac_duel_roll').GetValue|0]#! against [ROOT.Char.MakeScope.Var('ac_duel_roll').GetValue|0]), dealing #N [ac_duel_foe.MakeScope.Var('ac_duel_dealt').GetValue|0]#! damage."
 ac_duel.0001.tied:0 "Our techniques met evenly; neither of us gave ground."
 ac_duel.0001.blank:0 ""
 ac_duel.0001.surging:0 "\n\n#V My Cores are surging:#! my next move will spend a charge of its Core for a greater blow."
 ac_duel.0001.surge:0 "Surge my Cores"
 ac_duel_surge_tt:0 "My next move adds its Core's Surge value to the roll and hits 1 harder, spending one charge of that Core."
 ac_duel.0001.auto:0 "Fight on by instinct (auto-resolve)"
 ac_duel_auto_tt:0 "Resolve the remaining rounds automatically."
 ac_duel.0001.yield:0 "Yield"
 ac_duel_yield_tt:0 "Concede the duel."
 ac_duel.0002.t:0 "The Clash Ends"
 ac_duel.0002.won:0 "My aura stands while [ac_duel_loser.GetFirstName]'s falters. The victory is mine."
 ac_duel.0002.lost:0 "[ac_duel_winner.GetFirstName] stands over me. I have lost the clash."
 ac_duel.0002.draw:0 "Neither of us could break the other. The clash ends in a draw."
 ac_duel.0002.ok:0 "So the clash is decided."
 ac_duel_unleash_tt:0 "Once per duel. Spend 1 Chi to fight through the Technique's Core with #V +3#! to the roll, hitting 1 harder."
