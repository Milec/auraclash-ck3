l_english:
 activity_ac_cycle_gate:0 "Cycle the Heavenly Gate"
 activity_ac_cycle_gate_name:0 "[ACTIVITY.GetHost.GetShortUINamePossessive|U] Gate Cycling"
 activity_ac_cycle_gate_desc:0 "Travel to a Heavenly Gate while it surges and cycle its chi. A Gate holds only so much: the more cultivators share it, the less each absorbs."
 activity_ac_cycle_gate_owner:0 "Host"
 activity_ac_cycle_gate_host_an_a:0 "a"
 activity_ac_cycle_gate_destination_selection:0 "Choose a county where a Heavenly Gate surges."
 activity_ac_cycle_gate_selection_tooltip:0 "Cycle the chi of a surging Heavenly Gate."
 activity_ac_cycle_gate_guest_help_text:0 "Cycle the Gate with your companions: each gains Aura Pressure, Soul progress and a touch of the Heavens."
 activity_ac_cycle_gate_predicted_cost:0 "Provisions for the journey cost 10 gold."
 activity_ac_cycle_gate_province_desc:0 "The aura of the Heavens surges here."
 TRAVEL_NAME_FOR_activity_ac_cycle_gate:0 "Journey to a Heavenly Gate"
 activity_ac_cycle_gate_conclusion_desc:0 "The Gate's surge is spent, its chi drawn into the cultivators who reached it first."
 activity_ac_cycle_gate_guest_desc:0 "Cycle a Heavenly Gate's chi."
 activity_ac_cycle_gate_host_desc:0 "Lead the way to the Gate."
 ac_gate_cycling_phase:0 "Cycling the Gate"
 ac_gate_cycling_phase_desc:0 "Meditate where the aura surges and draw it in."
 ac_gate_cycle_intent:0 "Cycle the Chi"
 ac_gate_cycle_intent_desc:0 "Absorb as much of the Gate's aura as you can."
 ac_gate_location_tt:0 "A Heavenly Gate surges in this county"
 ac_heavenly_gate_modifier:0 "Heavenly Gate"
 ac_heavenly_gate_modifier_desc:0 "The aura of the Heavens surges here for a season. Cultivators may travel here to cycle it."
 ac_gate_touched_modifier:0 "Touched by a Heavenly Gate"
 ac_gate_touched_modifier_desc:0 "This cultivator has absorbed the chi of a Heavenly Gate."
 ac_gate.0001.t:0 "A Heavenly Gate Stirs"
 ac_gate.0001.desc:0 "My senses prickle. Somewhere in [ac_gate_county.GetName], the land's aura is surging like a storm about to break: a Heavenly Gate, level [ac_gate_county.MakeScope.Var('ac_gate_level').GetValue|0]. It will last a season, and every sect nearby will feel it too."
 ac_gate.0001.a:0 "I must reach it first."
 ac_gate.0001.a.tt:0 "Plan the #V Cycle the Heavenly Gate#! activity to travel there. Local cultivators will claim it after about 45 days."
 ac_gate.0020.t:0 "The Heavenly Gate"
 ac_gate.0020.desc:0 "The air ripples. Natural chi pours from the land, torn between every cultivator who reaches for it, until it bends to the hungriest soul."
 ac_gate.0020.a:0 "Cycle quietly and take my share."
 ac_gate.0020.a.tt:0 "Gain the Gate's level plus your Athletics or Insight successes in Aura Pressure, up to triple its level, shared out if many cultivate it."
 ac_gate.0020.b:0 "Drive off the local sect's disciples."
 ac_gate.0020.b.tt:0 "Fight a Clash of Auras. The winner takes half again as much of the Gate."
 ac_gate.0020.c:0 "Draw the whole Gate into my aura."
 ac_gate.0020.c.tt:0 "Try to awaken a Transformation with the Gate's entire power, at the cost of my share. Failure wounds me."
 ac_gate_awaken_failed_tt:0 "The Gate's power tears loose before I can shape it."
 ac_gate.0021.t:0 "The Power of the Gate"
 ac_gate.0021.desc:0 "An entire Heavenly Gate's worth of energy flares into a sphere of power that I squeeze down around myself, wrapping my body in a temporary aura: a stronger one, built for battle."
 building_ac_spirit_fruit_grove:0 "Spirit Fruit Grove"
 building_ac_spirit_fruit_grove_desc:0 "Trees that have soaked in ambient chi for generations. Their fruit raises a cultivator's Aura Pressure."
 building_type_ac_spirit_fruit_grove:0 "$building_ac_spirit_fruit_grove$"
 building_type_ac_spirit_fruit_grove_desc:0 "$building_ac_spirit_fruit_grove_desc$"
 ac_spirit_fruit_grove_effect_desc:0 "Each year the county's holder harvests 2 spirit fruit (up to 10 kept)."
 activity_ac_seek_grove:0 "Seek the Rumoured Grove"
 activity_ac_seek_grove_name:0 "[ACTIVITY.GetHost.GetShortUINamePossessive|U] Search for a Grove"
 activity_ac_seek_grove_desc:0 "Follow a rumour to a hidden Spirit Fruit Grove. Sects keep their groves secret; a sharp eye (Intrigue) or a sharp sense for chi (Learning) finds them."
 activity_ac_seek_grove_owner:0 "Seeker"
 activity_ac_seek_grove_host_an_a:0 "a"
 activity_ac_seek_grove_destination_selection:0 "Choose a county in the rumoured duchy."
 activity_ac_seek_grove_selection_tooltip:0 "Search for a rumoured Spirit Fruit Grove."
 activity_ac_seek_grove_guest_help_text:0 "Help search for a hidden Spirit Fruit Grove."
 activity_ac_seek_grove_predicted_cost:0 "Provisions for the search cost 15 gold."
 activity_ac_seek_grove_province_desc:0 "Somewhere in this duchy, the rumour says, trees glow with ambient chi."
 TRAVEL_NAME_FOR_activity_ac_seek_grove:0 "Journey to a Rumoured Grove"
 activity_ac_seek_grove_conclusion_desc:0 "The search is over, for better or worse."
 activity_ac_seek_grove_guest_desc:0 "Search for a hidden grove."
 activity_ac_seek_grove_host_desc:0 "Lead the search."
 ac_grove_search_phase:0 "Searching"
 ac_grove_search_phase_desc:0 "Comb the hills and valleys for trees soaked in chi."
 ac_grove_search_intent:0 "Search the Land"
 ac_grove_search_intent_desc:0 "Look and listen for the grove."
 ac_grove_location_tt:0 "A county of the duchy named in the rumour"
 ac_grove_narrowed_location_tt:0 "The county the trail now points to"
 ac_gate.0030.t:0 "Whispers of a Grove"
 ac_gate.0030.desc:0 "A peddler swears he saw trees that glowed at dusk, their fruit heavy with chi, somewhere in [ac_rumor_duchy.GetName]. If a sect keeps a Soulfruit Grove there, they guard the secret well."
 ac_gate.0030.a:0 "I will find it."
 ac_gate.0030.a.tt:0 "Plan the #V Seek the Rumoured Grove#! activity in a county of [ac_rumor_duchy.GetName]. The rumour fades after 3 years."
 ac_gate.0031.t:0 "The Search"
 ac_gate.0031.found:0 "Deep in the hills the air hums: a grove of ancient trees, their fruit glowing with chi. The Spirit Fruit Grove is found, and I bring back the first 3 fruit."
 ac_gate.0031.wrong:0 "Not here. But the locals point the way: the grove lies in [ac_rumor_county.GetName]. The next search there will go easier."
 ac_gate.0031.eluded:0 "The trail is here, I am sure of it, but the grove eludes me. The rumour still holds; I can search again."
 ac_gate.0031.a:0 "So be it."
 ac_share_spirit_fruit_interaction:0 "Share Spirit Fruit"
 ac_share_spirit_fruit_interaction_desc:0 "Offer [recipient.GetShortUIName] a spirit fruit from my groves (I have [actor.MakeScope.Var('ac_spirit_fruit').GetValue|0])."
 ac_share_spirit_fruit_tt:0 "Gains up to 10 Aura Pressure, less for each fruit eaten this year."
