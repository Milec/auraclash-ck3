l_english:
 rasen_council.0001.t:0 "The Exalted Council Convenes"
 rasen_council.0001.desc:0 "Since the disappearance of the Imperial family, the five Inner Kingdoms have kept a shaky peace through their seats on the Exalted Council, which rules Imperial Rasen from Azuma Honsha. The Council convenes, and as an Exalt I must cast my vote. The decree will fall where the votes are heaviest, though nothing on the Council is ever certain."
 rasen_council.0001.lobby:0 "Press my seat's cause: two votes for my own land's decree"
 rasen_council.0002.t:0 "A Decree of the Exalted Council"
 rasen_council.0002.ok:0 "As the Council pleases."
 rasen_council.0081.t:0 "An Exalt's Envoy"
 rasen_council.0081.desc:0 "Word has spread that an Exalt is sponsoring the favourite of this year's Heavenly Ascension Trials, greatly tipping the scales. Now an envoy of [rasen_counter_patron.GetTitledFirstName] arrives with gold and an offer: their Exalt will see me favoured, so long as I serve to counter the interference. Inter-council conflicts are not uncommon, and I would be a tool in one."
 rasen_council.0081.accept:0 "I accept the Exalt's patronage."
 rasen_council.0081.refuse:0 "I will rise on my own merit."
 rasen_archon_patrols_modifier:0 "Archon Patrols"
 rasen_archon_patrols_modifier_desc:0 "Archons of the Exalted Council keep the peace here."
 rasen_fiend_purge_modifier:0 "Fiend Purge"
 rasen_fiend_purge_modifier_desc:0 "Exorcist-monks hunt Fiends and all things unnatural."
 rasen_imperial_levy_modifier:0 "Imperial Levy"
 rasen_imperial_levy_modifier_desc:0 "The Outer provinces pay for the capital."
 rasen_council_outvoted_opinion:0 "Outvoted me on the Council"
 rasen_co_monarchy_diarchy_type:0 "Co-Monarchy of the Exalted Council"
 rasen_co_monarchy_diarch_title:0 "Co-Monarch"
 rasen_trial_patron_opinion:0 "My patron in the Trials"
 rasen_trial_protege_opinion:0 "My protégé in the Trials"
 rasen_council.0001.bladed:0 "Dispatch the Archons (the Bladed Lands value honour)"
 rasen_decree_archons_tt:0 "Archon patrols keep order in the Outer provinces for three years, and any Ice Incursion ends a year sooner."
 rasen_council.0002.bladed:0 "Heralds carry the Exalted Council's decree across the spiral continent: #V Dispatch the Archons#!.\n\nArchon patrols keep order in the Outer provinces for three years, and any Ice Incursion ends a year sooner."
 rasen_council.0001.sacred:0 "Purge the Fiends (the Sacred Lands value compassion)"
 rasen_decree_fiends_tt:0 "Every county resists disease for three years, and Devanic rulers gain #V 100#! piety."
 rasen_council.0002.sacred:0 "Heralds carry the Exalted Council's decree across the spiral continent: #V Purge the Fiends#!.\n\nEvery county resists disease for three years, and Devanic rulers gain #V 100#! piety."
 rasen_council.0001.mystic:0 "Open the Imperial Archives (the Mystic Lands value knowledge)"
 rasen_decree_archives_tt:0 "Lost knowledge from the Archonate archives is lent to the worthy: Path Manuals cost half as much for three years."
 rasen_council.0002.mystic:0 "Heralds carry the Exalted Council's decree across the spiral continent: #V Open the Imperial Archives#!.\n\nLost knowledge from the Archonate archives is lent to the worthy: Path Manuals cost half as much for three years."
 rasen_council.0001.cursed:0 "Levy the Outer Provinces (the Cursed Lands value practicality)"
 rasen_decree_levy_tt:0 "Each Exalt receives #V 150#! gold, and the Outer provinces pay heavier taxes for three years."
 rasen_council.0002.cursed:0 "Heralds carry the Exalted Council's decree across the spiral continent: #V Levy the Outer Provinces#!.\n\nEach Exalt receives #V 150#! gold, and the Outer provinces pay heavier taxes for three years."
 rasen_council.0001.wild:0 "Call the Trials (the Wild Lands value strength)"
 rasen_decree_trials_tt:0 "Strength must be found and claimed: the Heavenly Ascension Trials are called for next year."
 rasen_council.0002.wild:0 "Heralds carry the Exalted Council's decree across the spiral continent: #V Call the Trials#!.\n\nStrength must be found and claimed: the Heavenly Ascension Trials are called for next year."
