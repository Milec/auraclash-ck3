 ac_seal_craft_shard_interaction:0 "Craft Shard"
 ac_seal_craft_shard_interaction_desc:0 "#bold Craft Shard#! (Seal). Create Shards: 10 gold per success.\nRequires: Handseals +1d6 (2 Handseals perks). Cost: 100 Aura Pressure (1 Chi or 10 Shards)."
 ac_seal_craft_shard_effect_tt:0 "Create Shards: 10 gold per success."
 ac_seal_craft_shard_toast:0 "Craft Shard"
 ac_seal_reinforcement_interaction:0 "Reinforcement"
 ac_seal_reinforcement_interaction_desc:0 "#bold Reinforcement#! (Seal). Harden the target's arms and armour: +2 prowess and +5% knight effectiveness for a month per success; their equipment regains 10 durability per success.\nRequires: Handseals +1d6 (2 Handseals perks). Cost: 100 Aura Pressure (1 Chi or 10 Shards)."
 ac_seal_reinforcement_effect_tt:0 "Harden the target's arms and armour: +2 prowess and +5% knight effectiveness for a month per success; their equipment regains 10 durability per success."
 ac_seal_reinforcement_toast:0 "Reinforcement"
 ac_seal_four_winds_interaction:0 "Four Winds Enhancement"
 ac_seal_four_winds_interaction_desc:0 "#bold Four Winds Enhancement#! (Seal). +1d10 to a skill (here +3, or +5 prowess) for the caster, the target and one more courtier per extra success, for three months.\nRequires: Handseals +2d6 (5 Handseals perks). Cost: 100 Aura Pressure (1 Chi or 10 Shards)."
 ac_seal_four_winds_effect_tt:0 "+1d10 to a skill (here +3, or +5 prowess) for the caster, the target and one more courtier per extra success, for three months."
 ac_seal_four_winds_toast:0 "Four Winds Enhancement"
 ac_seal_keystone_interaction:0 "Keystone"
 ac_seal_keystone_interaction_desc:0 "#bold Keystone#! (Seal). A mystical lock on your chambers that only your keystones open: enemy schemes against you -10%, permanently (until Counterseal).\nRequires: Handseals +2d6 (5 Handseals perks). Cost: 300 Aura Pressure (3 Chi or 30 Shards)."
 ac_seal_keystone_effect_tt:0 "A mystical lock on your chambers that only your keystones open: enemy schemes against you -10%, permanently (until Counterseal)."
 ac_seal_keystone_toast:0 "Keystone"
 ac_seal_counterseal_interaction:0 "Counterseal"
 ac_seal_counterseal_interaction_desc:0 "#bold Counterseal#! (Seal). End the Seals on the target, if your successes match the caster's. Whether it works or not, you cannot try again on them for a year.\nRequires: Handseals +3d6 (8 Handseals perks). Cost: 200 Aura Pressure (2 Chi or 20 Shards)."
 ac_seal_counterseal_effect_tt:0 "End the Seals on the target, if your successes match the caster's. Whether it works or not, you cannot try again on them for a year."
 ac_seal_counterseal_toast:0 "Counterseal"
 ac_seal_reinforcement_improved_interaction:0 "Reinforcement (Improved)"
 ac_seal_reinforcement_improved_interaction_desc:0 "#bold Reinforcement (Improved)#! (Seal). The Reinforcement on your weapon is permanent (+2 prowess), and your soldiers' weapons gain +1 Power (+10% pikemen and heavy infantry damage) for 5 years.\nRequires: 300 AP in Akakiru Techniques (Akakiru). Cost: 100 Aura Pressure (1 Chi or 10 Shards)."
 ac_seal_reinforcement_improved_effect_tt:0 "The Reinforcement on your weapon is permanent (+2 prowess), and your soldiers' weapons gain +1 Power (+10% pikemen and heavy infantry damage) for 5 years."
 ac_seal_reinforcement_improved_toast:0 "Reinforcement (Improved)"
 ac_seal_soulsoak_interaction:0 "Soulsoak Imbuement"
 ac_seal_soulsoak_interaction_desc:0 "#bold Soulsoak Imbuement#! (Seal). Infuse chi into your blade (200 AP, or 400 for twice the charges). In a Clash of Auras, release a charge for +3 to a roll; outside combat, release one to heal a wound (Release Soulsoak). Lasts a month per success.\nRequires: 600 AP in Akakiru Techniques (Akakiru with 3 of its perks); Handseals +1d6 (2 Handseals perks). Cost: 200 Aura Pressure (2 Chi or 20 Shards)."
 ac_seal_soulsoak_effect_tt:0 "Infuse chi into your blade (200 AP, or 400 for twice the charges). In a Clash of Auras, release a charge for +3 to a roll; outside combat, release one to heal a wound (Release Soulsoak). Lasts a month per success."
 ac_seal_soulsoak_toast:0 "Soulsoak Imbuement"
 ac_seal_celestial_forge_interaction:0 "Celestial Forge"
 ac_seal_celestial_forge_interaction_desc:0 "#bold Celestial Forge#! (Seal). Exchange your Foundation for a different one, keeping its tempering.\nRequires: 900 AP in Akakiru Techniques (Akakiru with 7 of its perks); Handseals +2d6 (5 Handseals perks). Cost: 200 Aura Pressure (2 Chi or 20 Shards)."
 ac_seal_celestial_forge_effect_tt:0 "Exchange your Foundation for a different one, keeping its tempering."
 ac_seal_celestial_forge_toast:0 "Celestial Forge"
 ac_seal_exorcism_interaction:0 "Exorcism"
 ac_seal_exorcism_interaction_desc:0 "#bold Exorcism#! (Seal). Lay the dead of this county to rest (fewer Wraiths and malicious Kami: +5 county opinion, +5% development growth, a year per success). The thankful spirits lend +3 to a skill, a month per success.\nRequires: 300 AP in Aoyusumu Techniques (Aoyusumu). Cost: 200 Aura Pressure (2 Chi or 20 Shards)."
 ac_seal_exorcism_effect_tt:0 "Lay the dead of this county to rest (fewer Wraiths and malicious Kami: +5 county opinion, +5% development growth, a year per success). The thankful spirits lend +3 to a skill, a month per success."
 ac_seal_exorcism_toast:0 "Exorcism"
 ac_seal_prayer_engine_interaction:0 "Prayer Engine"
 ac_seal_prayer_engine_interaction_desc:0 "#bold Prayer Engine#! (Seal). Hear the thoughts of those who pray to you: +1 piety and +5 same-faith opinion a month, for two months per success. The basis of many religions.\nRequires: 500 AP in Aoyusumu Techniques (Aoyusumu with 3 of its perks); Handseals +1d6 (2 Handseals perks). Cost: 100 Aura Pressure (1 Chi or 10 Shards)."
 ac_seal_prayer_engine_effect_tt:0 "Hear the thoughts of those who pray to you: +1 piety and +5 same-faith opinion a month, for two months per success. The basis of many religions."
 ac_seal_prayer_engine_toast:0 "Prayer Engine"
 ac_seal_heavenly_message_interaction:0 "Heavenly Message"
 ac_seal_heavenly_message_interaction_desc:0 "#bold Heavenly Message#! (Seal). Meditate upon the Celestial Bureaucracy for a clue: vague (1-2 successes), helpful (3-4), valuable secrets (5-7) or forbidden knowledge (8+). A botch misleads.\nRequires: 700 AP in Aoyusumu Techniques (Aoyusumu with 5 of its perks); Handseals +1d6 (2 Handseals perks). Cost: 100 Aura Pressure (1 Chi or 10 Shards)."
 ac_seal_heavenly_message_effect_tt:0 "Meditate upon the Celestial Bureaucracy for a clue: vague (1-2 successes), helpful (3-4), valuable secrets (5-7) or forbidden knowledge (8+). A botch misleads."
 ac_seal_heavenly_message_toast:0 "Heavenly Message"
 ac_seal_divine_intervention_interaction:0 "Divine Intervention"
 ac_seal_divine_intervention_interaction_desc:0 "#bold Divine Intervention#! (Seal). Lock a success for someone anywhere who knows you or prays to you: +5 prowess, +10% scheme success and +1 to Clash rolls for three months.\nRequires: 900 AP in Aoyusumu Techniques (Aoyusumu with 7 of its perks); Handseals +2d6 (5 Handseals perks). Cost: 100 Aura Pressure (1 Chi or 10 Shards)."
 ac_seal_divine_intervention_effect_tt:0 "Lock a success for someone anywhere who knows you or prays to you: +5 prowess, +10% scheme success and +1 to Clash rolls for three months."
 ac_seal_divine_intervention_toast:0 "Divine Intervention"
 ac_seal_scry_interaction:0 "Scry"
 ac_seal_scry_interaction_desc:0 "#bold Scry#! (Seal). A sphere of aura shows any place within 10 miles per success: reveal the target's secrets (Ward and Thousand-Face Mask resist).\nRequires: 300 AP in Kiihakai Techniques (Kiihakai). Cost: 100 Aura Pressure (1 Chi or 10 Shards)."
 ac_seal_scry_effect_tt:0 "A sphere of aura shows any place within 10 miles per success: reveal the target's secrets (Ward and Thousand-Face Mask resist)."
 ac_seal_scry_toast:0 "Scry"
 ac_seal_ward_interaction:0 "Ward"
 ac_seal_ward_interaction_desc:0 "#bold Ward#! (Seal). Ward a person (enemy schemes against them -25%, a month per success) or, cast on yourself, the county you stand in (+2 fort level, +25% garrison, a year per success).\nRequires: 500 AP in Kiihakai Techniques (Kiihakai with 3 of its perks). Cost: 200 Aura Pressure (2 Chi or 20 Shards)."
 ac_seal_ward_effect_tt:0 "Ward a person (enemy schemes against them -25%, a month per success) or, cast on yourself, the county you stand in (+2 fort level, +25% garrison, a year per success)."
 ac_seal_ward_toast:0 "Ward"
 ac_seal_charm_interaction:0 "Charm"
 ac_seal_charm_interaction_desc:0 "#bold Charm#! (Seal). Contested by the target's Persuasion or Survival: on success they treat you as a good friend (+40 opinion for a year); on failure they turn hostile.\nRequires: 700 AP in Kiihakai Techniques (Kiihakai with 5 of its perks); Handseals +1d6 (2 Handseals perks). Cost: 200 Aura Pressure (2 Chi or 20 Shards)."
 ac_seal_charm_effect_tt:0 "Contested by the target's Persuasion or Survival: on success they treat you as a good friend (+40 opinion for a year); on failure they turn hostile."
 ac_seal_charm_toast:0 "Charm"
 ac_seal_spiritbinding_interaction:0 "Spiritbinding"
 ac_seal_spiritbinding_interaction_desc:0 "#bold Spiritbinding#! (Seal). Bind a spirit to a task: an Earth Elemental builds walls, a Water Elemental cleanses the land, Wisps shriek at intruders, or a Kami possesses a rival's tools. A day per success becomes a month; 5 successes binds it for good.\nRequires: 900 AP in Kiihakai Techniques (Kiihakai with 7 of its perks); Handseals +2d6 (5 Handseals perks). Cost: 300 Aura Pressure (3 Chi or 30 Shards)."
 ac_seal_spiritbinding_effect_tt:0 "Bind a spirit to a task: an Earth Elemental builds walls, a Water Elemental cleanses the land, Wisps shriek at intruders, or a Kami possesses a rival's tools. A day per success becomes a month; 5 successes binds it for good."
 ac_seal_spiritbinding_toast:0 "Spiritbinding"
 ac_seal_hex_interaction:0 "Hex"
 ac_seal_hex_interaction_desc:0 "#bold Hex#! (Seal). A Power Clash against the target (Aura Pressure decides): on success, a skill of your choice drops by 1 plus 2 per success (up to 12) for a year.\nRequires: 300 AP in Kurokonton Techniques (Kurokonton). Cost: 100 Aura Pressure (1 Chi or 10 Shards)."
 ac_seal_hex_effect_tt:0 "A Power Clash against the target (Aura Pressure decides): on success, a skill of your choice drops by 1 plus 2 per success (up to 12) for a year."
 ac_seal_hex_toast:0 "Hex"
 ac_seal_thousand_face_mask_interaction:0 "Thousand-Face Mask"
 ac_seal_thousand_face_mask_interaction_desc:0 "#bold Thousand-Face Mask#! (Seal). Change your appearance and mask your aura: +10% scheme success, and +20 scheme secrecy for three months; Scry fails on you.\nRequires: 600 AP in Kurokonton Techniques (Kurokonton with 3 of its perks); Handseals +1d6 (2 Handseals perks). Cost: 100 Aura Pressure (1 Chi or 10 Shards)."
 ac_seal_thousand_face_mask_effect_tt:0 "Change your appearance and mask your aura: +10% scheme success, and +20 scheme secrecy for three months; Scry fails on you."
 ac_seal_thousand_face_mask_toast:0 "Thousand-Face Mask"
 ac_seal_puppetmaster_interaction:0 "Puppetmaster"
 ac_seal_puppetmaster_interaction_desc:0 "#bold Puppetmaster#! (Seal). Bind a much weaker humanoid as your Minion (a strong hook). Needs 3 successes; each extra success lengthens it, from a day (a month) to permanent. Costs the target's Aura Pressure.\nRequires: 900 AP in Kurokonton Techniques (Kurokonton with 7 of its perks); Handseals +1d6 (2 Handseals perks). Cost: the target's Aura Pressure."
 ac_seal_puppetmaster_effect_tt:0 "Bind a much weaker humanoid as your Minion (a strong hook). Needs 3 successes; each extra success lengthens it, from a day (a month) to permanent. Costs the target's Aura Pressure."
 ac_seal_puppetmaster_toast:0 "Puppetmaster"
 ac_seal_subjugation_domain_interaction:0 "Subjugation Domain"
 ac_seal_subjugation_domain_interaction_desc:0 "#bold Subjugation Domain#! (Seal). Claim the county you stand in as a Beast claims territory: Beasts keep away (+10% levies, +5 county opinion, +10% development growth) and you gain Advantage on Perception and Survival. One Domain at a time.\nRequires: 300 AP in Midorikatai Techniques (Midorikatai). Cost: 300 Aura Pressure (3 Chi or 30 Shards)."
 ac_seal_subjugation_domain_effect_tt:0 "Claim the county you stand in as a Beast claims territory: Beasts keep away (+10% levies, +5 county opinion, +10% development growth) and you gain Advantage on Perception and Survival. One Domain at a time."
 ac_seal_subjugation_domain_toast:0 "Subjugation Domain"
 ac_seal_alpha_seal_interaction:0 "Alpha Seal"
 ac_seal_alpha_seal_interaction_desc:0 "#bold Alpha Seal#! (Seal). Seal a Beast you have just brought down: it serves you as its Master (prowess, dread and knight effectiveness). Only one Beast at a time.\nRequires: 600 AP in Midorikatai Techniques (Midorikatai with 3 of its perks); Handseals +1d6 (2 Handseals perks). Cost: 200 Aura Pressure (2 Chi or 20 Shards)."
 ac_seal_alpha_seal_effect_tt:0 "Seal a Beast you have just brought down: it serves you as its Master (prowess, dread and knight effectiveness). Only one Beast at a time."
 ac_seal_alpha_seal_toast:0 "Alpha Seal"
 ac_seal_unlock_potential_interaction:0 "Unlock Potential"
 ac_seal_unlock_potential_interaction_desc:0 "#bold Unlock Potential#! (Seal). Grant 100 Aura Pressure, plus 100 per 1,000 of your own, to someone with less than half of yours. Costs as much as it grants.\nRequires: 900 AP in Midorikatai Techniques (Midorikatai with 7 of its perks); Handseals +2d6 (5 Handseals perks). Cost: the Aura Pressure granted."
 ac_seal_unlock_potential_effect_tt:0 "Grant 100 Aura Pressure, plus 100 per 1,000 of your own, to someone with less than half of yours. Costs as much as it grants."
 ac_seal_unlock_potential_toast:0 "Unlock Potential"
