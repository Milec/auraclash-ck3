 trait_ac_cultivator:0 "Cultivator"
 trait_ac_cultivator_desc:0 "This character has awakened the ability to sense and gather chi. Their body is tougher and longer-lived than a mortal's, and the paths of cultivation are open to them: Core training, Foundations, Martial Arts Styles, Elements, and the Cultivation lifestyle."
