 setting_ac_cultivator_aging_slowed_desc:0 "From age 22 (or when they awaken, if later), cultivators age only 5 visible years over as many real years as their longevity bonus: by default they look 22-27 from 22 to 42. In old age, or if their health fails for reasons other than wounds or a passing illness, they fall into the Death Spiral and their age catches up."
