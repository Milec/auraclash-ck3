 ac_mortal_core_training_decision:0 "Mortal Core Training"
 ac_mortal_core_training_decision_desc:0 "Pour your reputation into hard training, drilling one of your four Combat Cores. Soul sharpens [learning|E], Agility sharpens [intrigue|E], Power sharpens [martial|E], and Fortitude sharpens [stewardship|E]."
 ac_mortal_core_training_decision_tooltip:0 "Spend #V [ROOT.Char.MakeScope.ScriptValue('ac_core_formation_cost')|0]#! [prestige|E] once per year to raise a Core by 1. You can also turn automatic yearly training on or off here."
 ac_mortal_core_training_decision_confirm:0 "Begin training"
 ac_learn_martial_style_decision_confirm:0 "Seek a master"
 ac_awaken_element_decision_confirm:0 "Begin attunement"
 ac_mortal_core_training_decision_effect_tt:0 "Choose which Core to train, or toggle automatic training."
 ac_immortal_core_advancement_decision:0 "Immortal Core Advancement"
 ac_immortal_core_advancement_decision_desc:0 "Meditate on the heavens and attempt to condense your scattered chi into an Immortal Core. Few succeed on the first attempt; every failure brings Insight."
 ac_immortal_core_advancement_decision_tooltip:0 "Attempt to form an #V Immortal Core#! through a [learning|E] and [martial|E] check."
 ac_immortal_core_advancement_decision_confirm:0 "Begin the meditation"
 ac_immortal_core_advancement_decision_check_tt:0 "Success chance improves with your combined [learning|E] and [martial|E] skill, your Foundation, and +5% Insight for each past failure."
 ac_immortal_core_advancement_decision.success:0 "Your chi condenses into a core"
 ac_immortal_core_advancement_decision.failure:0 "The core collapses"
 ac_immortal_core_success_toast:0 "Immortal Core Formed"
 ac_immortal_core_failure_toast:0 "The Core Collapsed"
 ac_immortal_core_xp_tt:0 "You gain #P 60#! total cultivation experience each quarter, divided equally among Elements, Martial Styles, and Handseals & Alchemy, whatever your focus."
 ac_immortal_core_insight_tt:0 "You gain #P +5%#! Insight toward your next attempt."
 ac_learn_martial_style_decision:0 "Study a Martial Arts Style"
 ac_learn_martial_style_decision_desc:0 "Seek out a master and commit to one of the five great Martial Arts Styles. A cultivator can only ever truly master one, and studying a Style or an Element takes a year of focus before you can study another."
 ac_learn_martial_style_decision_tooltip:0 "Choose a #V Martial Arts Style#! and attempt to learn it: 4% per point of its skill (certain at 25). Failure refunds the cost but wounds you."
 ac_learn_martial_style_decision_effect_tt:0 "Choose one of the five Martial Arts Styles."
 ac_awaken_element_decision:0 "Awaken Elemental Affinity"
 ac_awaken_element_decision_desc:0 "Attune your chi to an element. A cultivator can hold up to 2 affinities, and each one is permanent. Studying a Style or an Element takes a year of focus before you can study another."
 ac_awaken_element_decision_tooltip:0 "Choose an #V Element#! and attempt to attune to it: 4% per point of the higher of its two skills (certain at 25). Failure refunds the cost but wounds you."
 ac_awaken_element_decision_effect_tt:0 "Choose one of the elements."
 ac_train_cultivation_interaction:0 "Train in Cultivation"
 ac_train_cultivation_interaction_desc:0 "Push this character through the brutal training that can awaken a cultivator."
 ac_train_cultivation_relation_tt:0 "The recipient must be your child, ward, friend, best friend, lover, soulmate, spouse, fellow sect member, or hold a usable hook on you"
 ac_train_cultivation_chance_tt:0 "Success: +1% per point of their [martial|E] and [learning|E], +1% per dot across your Combat Cores (max 100%). Failure leaves them #N wounded#!."
 ac_train_cultivation_interaction.success:0 "Their chi awakens"
 ac_train_cultivation_interaction.failure:0 "Their body breaks under the strain"
 ac_train_cultivation_success_toast:0 "A New Cultivator Awakens"
 ac_train_cultivation_failure_toast:0 "The Training Failed"
 ac_chi_healing_interaction:0 "Chi Healing"
