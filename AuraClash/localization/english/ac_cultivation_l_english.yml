 ac_scry_interaction_desc:0 "Form a sphere of aura and spy on this character, hoping to uncover their secrets."
 ac_scry_chance_tt:0 "Success chance: your [learning|E] + [intrigue|E], as a percentage."
 ac_scry_interaction.success:0 "The sphere reveals what they hide"
 ac_scry_interaction.failure:0 "Their aura clouds the sphere"
 ac_scry_found_toast:0 "Secrets Revealed by Scrying"
 ac_scry_nothing_toast:0 "The Sphere Shows Nothing Hidden"
 ac_scry_failed_toast:0 "The Scrying Failed"
