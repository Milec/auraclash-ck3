 ac_cult.0300.rabbit:0 "The way of the Rabbit"
 ac_cult.0300.tiger:0 "The way of the Tiger"
 ac_cult.0300.snake:0 "The way of the Snake"
 ac_cult.0300.stallion:0 "The way of the Stallion"
 ac_cult.0300.ram:0 "The way of the Ram"
 ac_cult.0301.monkey:0 "The way of the Monkey"
 ac_cult.0301.crane:0 "The way of the Crane"
 ac_cult.0301.wolf:0 "The way of the Wolf"
 ac_cult.0301.boar:0 "The way of the Boar"
 ac_cult.0301.rat:0 "The way of the Rat"
 ac_cult.0301.ox:0 "The way of the Ox"
 ac_cult.0300.nav:0 "See the other paths..."
 ac_cult.0301.nav:0 "Back to the first paths..."
 ac_cult.0300.t:0 "Laying a Foundation"
 ac_cult.0300.desc:0 "Your chi has awakened, but it needs a shape to grow into. The old masters teach twelve Foundations, each named for one of the zodiac beasts. Choose the one that matches your nature: it will carry your cultivation for the rest of your life, and battle will temper it further."
 ac_cult.0001.t:0 "Mortal Core Training"
 ac_cult.0001.desc:0 "A cultivator's strength rests on four Combat Cores. You have #V [ROOT.Char.MakeScope.ScriptValue('ac_core_dots')|0]#! total Core dots. Each year you can spend #V [ROOT.Char.MakeScope.ScriptValue('ac_core_formation_cost')|0]#! [prestige|E] to drive one of them further.\n\n"
 ac_cult.0001.desc_cooldown:0 "Your cores are still recovering from your last training. "
 ac_cult.0001.desc_ready:0 "Your cores are rested and ready. "
 ac_cult.0001.desc_auto_on:0 "\n\n#P Auto-training is ON#!: your last choice repeats every year while you can afford it."
 ac_cult.0001.desc_auto_off:0 "\n\nAuto-training is off."
 ac_cult.0001.auto_on:0 "Repeat my training automatically every year"
 ac_cult.0001.auto_on.tt:0 "Whatever Core you train will be trained again each year, as long as you have the [prestige|E]. Select this decision again to turn it off."
 ac_cult.0001.auto_off:0 "Stop automatic training"
 ac_cult.0001.auto_off.tt:0 "Your Cores will no longer be trained automatically."
 ac_cult.0001.leave:0 "Not now"

 ac_awakening_access_tt:0 "You need a living cultivator parent, a cultivator guardian (or their earlier teaching), a living cultivator friend, best friend, lover, soulmate or spouse, a usable hook on an adult cultivator, or sect membership. A hook is spent if it is your only source of access."
 ac_awakening_cooldown_tt:0 "You have not attempted an awakening ordeal in the past year"
 ac_seek_cultivation_decision:0 "Seek Cultivation"
 ac_seek_cultivation_decision_desc:0 "Ambition will not let me accept a mortal's limits. I will spend my wealth, reputation and religious standing to seek out hidden teachers and forbidden instruction, then attempt the awakening ordeal."
 ac_seek_cultivation_decision_tooltip:0 "Fund a search for cultivation teachings and attempt awakening. Requires Ambitious; costs 100 gold, 250 prestige and 250 piety."
 ac_seek_cultivation_decision_confirm:0 "Seek the path"

 ac_request_cultivation_interaction:0 "Request Cultivation Training"
 ac_request_cultivation_interaction_desc:0 "Ask [recipient.GetShortUINameNoTooltip] to guide your awakening as a Cultivator. Requires a qualifying relationship with this teacher (including your parent), earlier teaching from this guardian, membership in the same sect, or your usable hook on this teacher. Costs 100 prestige; failure can leave you wounded. All awakening routes share a one-year attempt cooldown."
 ac_martial_styles_lifestyle:0 "Martial Styles"
 ac_martial_styles_lifestyle_name:0 "Martial Styles"
 ac_martial_styles_lifestyle_desc:0 "Master the techniques of your chosen martial style. Learn a style through Study a Martial Arts Style to unlock its perk tree."
 ac_martial_styles_lifestyle_highlight_desc:0 "Your Immortal Core shares cultivation experience across all three disciplines, whatever your focus."
 ac_elements_lifestyle:0 "Elements"
 ac_elements_lifestyle_name:0 "Elements"
 ac_elements_lifestyle_desc:0 "Deepen your elemental affinities. Awaken Elemental Affinity unlocks the trees of your learned elements; you can attune to two."
 ac_elements_lifestyle_highlight_desc:0 "Your Immortal Core shares cultivation experience across all three disciplines, whatever your focus."
 ac_elemental_attunement_focus:0 "Elemental Attunement"
 ac_elemental_attunement_focus_desc:0 "Attune your chi to the forces of nature and practise shaping your elements."
 ac_elemental_attunement_focus_effect_desc:0 "Gain Elements experience while improving your learning and prowess."
