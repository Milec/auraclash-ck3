 ac_cult.0100.t:0 "The Five Styles"
 ac_cult.0100.desc:0 "Masters of the five great Martial Arts Styles each offer to test you. Your chance of passing depends on the Style's skill (4% per point, certain at 25). Fail, and the master returns your fee along with a beating. A cultivator can only ever master one Style."
 ac_cult.0200.darkness:0 "Follow the path of Darkness Element ([intrigue|E] or [learning|E])"
 ac_cult.0200.earth:0 "Follow the path of Earth Element ([stewardship|E] or [diplomacy|E])"
 ac_cult.0200.fire:0 "Follow the path of Fire Element ([martial|E] or [learning|E])"
 ac_cult.0200.ice:0 "Follow the path of Ice Element ([stewardship|E] or [martial|E])"
 ac_cult.0201.light:0 "Follow the path of Light Element ([learning|E] or [intrigue|E])"
 ac_cult.0201.storm:0 "Follow the path of Storm Element ([learning|E] or [stewardship|E])"
 ac_cult.0201.water:0 "Follow the path of Water Element ([diplomacy|E] or [martial|E])"
 ac_cult.0201.wind:0 "Follow the path of Wind Element ([martial|E] or [intrigue|E])"
 ac_cult.0200.nav:0 "See the other paths..."
 ac_cult.0201.nav:0 "Back to the first paths..."
 ac_cult.0200.t:0 "Elemental Affinity"
 ac_cult.0200.desc:0 "You sink into meditation and let your chi drift toward the element that calls to it. Your chance of attuning depends on the higher of the element's two skills (4% per point, certain at 25). A failed attunement refunds your offering but wounds you. You can hold up to 2 affinities, and each is permanent."
