l_english:
 trait_ac_race_human:0 "Human"
 trait_ac_race_human_desc:0 "Like most of the people on the planet, a Human. The Human body is designed perfectly for cycling chi; it was Humans who rebuilt this world after the last Calamity. Racial bonus: Lore (+1 [learning|E]); Aura Pressure +10%."
 trait_ac_race_oni:0 "Oni"
 trait_ac_race_oni_desc:0 "Oni descend from spirits or demons who manifested a physical form by stealing and warping a human body, marked by the hereditary taint of red skin. Distrusted as thieves or cultists in rural lands, in the major cities many control banks and trade. Racial bonus: Deception (+1 [intrigue|E]); Ice and Fire chi come naturally."
 trait_ac_race_lunargoth:0 "Lunargoth"
 trait_ac_race_lunargoth_desc:0 "Lunargoths are born with a cascade of colours: lighter skin, round eyes of blue, green, grey or amber, and hair from black to white, gold or red. Legends say their people came down from the Moon centuries ago, to lands of darkstone Gothic architecture. Racial bonus: Craft (+1 [stewardship|E])."
 trait_ac_race_kitsune:0 "Kitsune"
 trait_ac_race_kitsune_desc:0 "The least common of all races: not quite Yokai, but a cross of Beast, Spirit and Man. Their mysterious essence and mischievous nature mark them as dangers to society, and many Sects class them as hostile trickster spirits rather than a race. They gain tails as their power grows. Knows the Fox Charm Technique."
 trait_ac_race_yokai_cat:0 "Cat Yokai"
 trait_ac_race_yokai_cat_desc:0 "Descended from felines who Advanced into human form generations ago; most keep ears, eyes or fangs, and almost all have a tail. Midorikatai comes naturally to Yokai."
 trait_ac_race_yokai_wolf:0 "Wolf Yokai"
 trait_ac_race_yokai_wolf_desc:0 "Descended from canines who Advanced into human form generations ago; most keep ears, eyes or fangs, and almost all have a tail. Midorikatai comes naturally to Yokai."
 trait_ac_race_yokai_reptile:0 "Reptile Yokai"
 trait_ac_race_yokai_reptile_desc:0 "Descended from reptiles who Advanced into human form generations ago; most keep eyes, fangs or scales, and almost all have a tail. Midorikatai comes naturally to Yokai."
 trait_ac_race_yokai_monkey:0 "Monkey Yokai"
 trait_ac_race_yokai_monkey_desc:0 "Descended from monkeys who Advanced into human form generations ago; most keep ears, eyes or fangs, and almost all have a tail. Midorikatai comes naturally to Yokai."
 trait_ac_race_yokai_bovine:0 "Bovine Yokai"
 trait_ac_race_yokai_bovine_desc:0 "Descended from bovines who Advanced into human form generations ago; most keep horns, eyes or ears, and almost all have a tail. Midorikatai comes naturally to Yokai."
 trait_ac_race_kitsune_tails_desc:0 "$trait_ac_race_kitsune_desc$\n\nTails: #V [ROOT.GetCharacter.MakeScope.ScriptValue('ac_kitsune_tails')|0]#! (one, plus one per eight Immortal Cores, up to nine)."
