l_english:
 ac_child.0001.t:0 "Breath and Stillness"
 ac_child.0001.desc_parent:0 "Another year has passed for [ac_chi_child.GetFirstName|U], and my child no longer fidgets when I sit in meditation. This morning they copied my breathing without being asked, and for a moment I felt their chi stir in answer to mine.\n\n"
 ac_child.0001.desc_guardian:0 "Another year has passed since [ac_chi_child.GetFirstName|U] came under my guardianship. My ward watches my morning practice with an intensity unusual in a child, and when I guide their breathing their chi stirs in answer to mine.\n\n"
 ac_child.0001.desc_progress:0 "A child cannot yet awaken, but chi nurtured early will remain until they come of age. [ac_chi_child.GetFirstName|U] has #V [ac_chi_child.MakeScope.ScriptValue('ac_childhood_nurture_level')|0]#! of #V [ac_chi_child.MakeScope.ScriptValue('ac_childhood_nurture_max')|0]#! years of nurtured chi. At 16, two or more years can spark an awakening."
 ac_child.0001.breath:0 "Teach the breathing forms and the stillness of the mind"
 ac_child.0001.stances:0 "Drill the stances at dawn until their legs shake"
 ac_child.0001.rest:0 "Let them be a child a while longer"
 ac_child.0010.t:0 "The Spark of Chi"
 ac_child.0010.desc:0 "Years of lessons beside a cultivator have left something coiled beneath my breastbone. On the morning I came of age, it woke before I did.\n\nThe chi nurtured through my childhood is pressing against the door. If I push now, it may open. Success chance: #V [ROOT.Char.MakeScope.ScriptValue('ac_childhood_awaken_success_chance')|0]%#!."
 ac_child.0010.attempt:0 "Open the door"
 ac_child.0010.decline:0 "Not like this"
 ac_child.0010.decline_tt:0 "The nurtured chi fades. You can still awaken through a teacher or a sect."
 ac_childhood_spark_check_tt:0 "This attempt costs nothing. Success uses the normal [martial|E] and [learning|E] check, plus #V 8%#! per year of nurtured chi (max 95%). Failure leaves you #N wounded#!. It shares the one-year awakening cooldown."
