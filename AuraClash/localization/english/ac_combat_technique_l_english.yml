 ac_tech.0001.t:0 "Focused Techniques"
 ac_tech.0001.desc:0 "In a neverending pursuit of Advancement, I meditate upon my Techniques. Certain Techniques must be Focused to a Core to gain their full benefits.\n\nChi Pool: #V [ROOT.Char.MakeScope.ScriptValue('ac_chi_available')|0]#! of #V [ROOT.Char.MakeScope.ScriptValue('ac_chi_pool')|0]#!. Surge values: Power #V [ROOT.Char.MakeScope.ScriptValue('ac_core_power_surge_value')|0]#!, Fortitude #V [ROOT.Char.MakeScope.ScriptValue('ac_core_fortitude_surge_value')|0]#!, Agility #V [ROOT.Char.MakeScope.ScriptValue('ac_core_agility_surge_value')|0]#!, Soul #V [ROOT.Char.MakeScope.ScriptValue('ac_core_soul_surge_value')|0]#!.\n"
