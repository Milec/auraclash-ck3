l_english:
 trait_ac_archonate_disciple:0 "Archonate Disciple"
 trait_ac_archonate_disciple_desc:0 "This cultivator passed the Heavenly Ascension Trials and joined the Archonate, the Exalted Council's force of Archons and the most prestigious sect in the empire. The Archonate trains its disciples in true Martial Arts, granting 100 cultivation experience each year."
 ac_ascend.0001.t:0 "The Imperial Draft"
 ac_ascend.0001.desc:0 "A sealed envelope arrives bearing the Imperial crest.\n\n#italic Young Martial Artists of the Outer Provinces, kowtow with tears of joy before the graves of your ancestors and thank them for your birth, for you have been chosen! The Exalted Council, in their infinite and transcendent wisdom, have chosen the Outer West town of Nanhou to host the next Heavenly Ascension Trials.\n\nThose under 25 from among the Warrior Caste who have talent, drive, and exceed mortal expectations, this is your chance to prove yourselves worthy. Succeed and the gold inside this package is the least of your treasures, for you shall be accepted into the Archonate. Fail and become a stepping stone for your betters.#!\n\nSigned and sealed by the Imperial Scribe of the Central Division. A few pristinely minted gold coins fall out of the envelope."
 ac_ascend.0001.enter:0 "Nanhou awaits"
 ac_ascend.0001.enter_tt:0 "In three months you face the Tiger, Rabbit and Dragon Trials, each scored from 0 to 7 by the Imperial clerks. No one is disqualified until all three are complete. A total of #V 15#! or more earns a place in the Archonate."
 ac_ascend.0001.decline:0 "Ignore the summons"
 ac_ascend.0001.decline_tt:0 "The Trials are a draft for the strong. Those who ignore it are remembered as cowards."
 ac_ascend.0010.t:0 "The Tiger Trial"
 ac_ascend.0010.desc:0 "A shimmering dome of chi rises over the contestants' section of the Tiger Arena and the roar of the crowd falls silent. Bōgu-masked clerks call out the rules: don the weighted plates and march to the arena wall. The Tiger Trial tests strength, and twenty plates earn the best score.\n\nAbove the arena, five masked Judges, one from each Inner Kingdom, watch more than your strength. To offset the burden, I..."
 ac_ascend.0010.back:0 "Hook my thumbs under the ropes and march like a rucker"
 ac_ascend.0010.legs:0 "Keep a low stance and drive with my legs"
 ac_ascend.0010.twenty:0 "Strap on all twenty plates and force my way to the wall"
 ac_ascend.0010.help:0 "Pull a contestant out from under their fallen plates"
 ac_ascend.0010.surge:0 "Push my Power Core to the limit"
 ac_ascend.0020.t:0 "The Rabbit Trial"
 ac_ascend.0020.desc:0 "My Trial badge glows: #V [ROOT.Char.MakeScope.ScriptValue('ac_trial_tiger_score')|0]#! points in the Tiger Trial. A score of five is a pass.\n\nIn the tunnel beneath the arena, a white line of paint marks the start of a race. #italic The Rabbit Trial is a test of speed and evasion. Just as every Archon must demonstrate strength, so too must they survive challenges far above their abilities.#! Reaching the end first is only the beginning. The Rabbit Trial is about being prey."
 ac_ascend.0020.run:0 "Outrun them all"
 ac_ascend.0020.route:0 "Read the tunnel and find the escape route no one else sees"
 ac_ascend.0020.crash:0 "Crash straight through every attack in my way"
 ac_ascend.0020.delay:0 "Hold back a stronger attacker so the others can escape"
 ac_ascend.0020.trip:0 "Trip the contestants beside me; prey only has to outrun the slowest"
 ac_ascend.0020.surge:0 "Push my Agility Core to the limit"
 ac_ascend.0030.t:0 "The Dragon Trial"
 ac_ascend.0030.desc:0 "My badge glows again: #V [ROOT.Char.MakeScope.ScriptValue('ac_trial_rabbit_score')|0]#! points in the Rabbit Trial.\n\nEach contestant in the Dragon Trial is released into the wilds with a medallion that slowly measures their Aura Pressure. A lost medallion loses its count, and medallions can be taken. Somewhere on this island is [ROOT.Char.Var('ac_ascension_rival').Char.GetTitledFirstName], the favourite of the crowds."
 ac_ascend.0030.cycle:0 "Find a quiet place, cycle my chi and let the medallion count"
 ac_ascend.0030.defend:0 "Wear my medallion openly and meet every challenger fairly"
 ac_ascend.0030.ambush:0 "Hunt the weak and take their medallions"
 ac_ascend.0030.shadow:0 "Shadow a stronger group and collect what they drop"
 ac_ascend.0030.protect:0 "Guard a weaker contestant's medallion as well as my own"
 ac_ascend.0030.study:0 "Study the counting formation inside the medallion"
 ac_ascend.0050.t:0 "The Trials Conclude"
 ac_ascend.0050.desc_scores:0 "The Imperial clerks read the scores aloud. Tiger Trial: #V [ROOT.Char.MakeScope.ScriptValue('ac_trial_tiger_score')|0]#!. Rabbit Trial: #V [ROOT.Char.MakeScope.ScriptValue('ac_trial_rabbit_score')|0]#!. Dragon Trial: #V [ROOT.Char.MakeScope.ScriptValue('ac_trial_dragon_score')|0]#!. Total: #V [ROOT.Char.MakeScope.ScriptValue('ac_ascension_total')|0]#!.\n\n"
 ac_ascend.0050.desc_top:0 "My name is read among the Top Five aspirants of the Trials. An Archon descends to fasten a jade token to my belt: I am a disciple of the Archonate."
 ac_ascend.0050.desc_admitted:0 "My badge glows white with a passing score. I have been accepted into the Archonate, to be trained in true Martial Arts."
 ac_ascend.0050.desc_eliminated:0 "My badge stays dark. Thousands went in; only hundreds come out. I leave Nanhou a stepping stone for my betters, for now."
 ac_ascend.0050.desc_beat_rival:0 "\n\nThe crowd's favourite, [ROOT.Char.Var('ac_ascension_rival').Char.GetTitledFirstName], finished below me."
 ac_ascend.0050.desc_lost_rival:0 "\n\nThe crowd's favourite, [ROOT.Char.Var('ac_ascension_rival').Char.GetTitledFirstName], finished above me."
 ac_ascend.0050.desc_favor:0 "\n\nThe Inner Kingdoms' Favor: Bladed #V [ROOT.Char.MakeScope.ScriptValue('ac_favor_bladed_value')|0]#!, Divine #V [ROOT.Char.MakeScope.ScriptValue('ac_favor_sacred_value')|0]#!, Mystic #V [ROOT.Char.MakeScope.ScriptValue('ac_favor_mystic_value')|0]#!, Cursed #V [ROOT.Char.MakeScope.ScriptValue('ac_favor_cursed_value')|0]#!, Wild #V [ROOT.Char.MakeScope.ScriptValue('ac_favor_wild_value')|0]#!."
 ac_ascend.0050.ok:0 "So ends the Heavenly Ascension Trials"
 ac_ascend.0050.top_tt:0 "Among the Top Five: an additional #P 300#! [prestige|E]."
 ac_eighth_point_bladed:0 "The Bladed Lands Grant an Eighth Point"
 ac_eighth_point_sacred:0 "The Sacred Lands Grant an Eighth Point"
 ac_eighth_point_mystic:0 "The Mystic Lands Grant an Eighth Point"
 ac_eighth_point_cursed:0 "The Cursed Lands Grant an Eighth Point"
 ac_eighth_point_wild:0 "The Wild Lands Grant an Eighth Point"
 ac_favor_bladed_up_tt:0 "The Bladed Judge approves of honourable action: #P Bladed Favor +1#!. A perfect score may earn an eighth point."
 ac_favor_sacred_up_tt:0 "The Sacred Judge approves of compassion: #P Divine Favor +1#!. A perfect score may earn an eighth point."
 ac_favor_mystic_up_tt:0 "The Mystic Judge approves of intelligence: #P Mystic Favor +1#!. A perfect score may earn an eighth point."
 ac_favor_cursed_up_tt:0 "The Cursed Judge approves of practical results: #P Cursed Favor +1#!. A perfect score may earn an eighth point."
 ac_favor_wild_up_tt:0 "The Wild Judge approves of ruthless strength: #P Wild Favor +1#!. A perfect score may earn an eighth point."
 ac_favor_bladed_down_tt:0 "The Bladed Judge disapproves: #N Bladed Favor -1#!."
 ac_favor_sacred_down_tt:0 "The Sacred Judge disapproves: #N Divine Favor -1#!."
 ac_favor_mystic_down_tt:0 "The Mystic Judge disapproves: #N Mystic Favor -1#!."
 ac_favor_cursed_down_tt:0 "The Cursed Judge disapproves: #N Cursed Favor -1#!."
 ac_favor_wild_down_tt:0 "The Wild Judge disapproves: #N Wild Favor -1#!."
