l_english:
 trait_ac_archonate_disciple:0 "Archonate Disciple"
 trait_ac_archonate_disciple_desc:0 "This cultivator won the Heavenly Ascension Trials and joined the Archonate, the most prestigious sect in the empire. The Archonate's teachings grant 100 cultivation experience each year."
 ac_ascend.0001.t:0 "Heralds of the Archonate"
 ac_ascend.0001.desc:0 "Riders in gold-trimmed robes have crossed every road in the empire with the same proclamation: the Heavenly Ascension Trials will open in Nanhou. Ten thousand young martial artists will climb, bleed and duel for a handful of places in the Archonate.\n\nThe entry fee is #V [ROOT.Char.MakeScope.ScriptValue('ac_ascension_entry_gold')|0]#! [gold|E]. Only cultivators aged 16 to 40 may compete."
 ac_ascend.0001.enter:0 "Nanhou awaits"
 ac_ascend.0001.enter_tt:0 "In three months you will face three rounds: endurance, the heart, and a duel on the Heavenly Stage. Winning the duel with at least #V 3#! points earns a place in the Archonate."
 ac_ascend.0001.decline:0 "Let others chase the Archonate's favour"
 ac_ascend.0010.t:0 "The Gate of Ten Thousand Steps"
 ac_ascend.0010.desc:0 "The first trial is a stair cut into the mountain above Nanhou. A gravity formation thickens the air with every step. Around me, thousands of competitors are already crawling; some have stopped moving altogether.\n\nThe examiners above care only about who reaches the gate."
 ac_ascend.0010.endure:0 "Endure. One step, then the next."
 ac_ascend.0010.flow:0 "Find the gaps in the formation and slip through them"
 ac_ascend.0010.shove:0 "Clear the stair. The weak can fall."
 ac_ascend.0010.carry:0 "Carry the competitor collapsed beside me"
 ac_ascend.0010.carry_tt:0 "You pass the gate, but earn no points this round. Your rival saw what you did."
 ac_ascend.0020.t:0 "The Mirror of the Heart Demon"
 ac_ascend.0020.desc:0 "The second trial takes place in a hall of black mirrors. Every surface shows the person I fear becoming, speaking in my own voice. Those who break here leave with their minds cracked."
 ac_ascend.0020.still:0 "Still my mind and let the reflection speak itself hoarse"
 ac_ascend.0020.element:0 "Turn my element on the mirror and shatter the illusion"
 ac_ascend.0020.embrace:0 "Listen to the demon. It wants what I want."
 ac_ascend.0030.t:0 "The Heavenly Stage"
 ac_ascend.0030.desc:0 "Only a few hundred remain. The final trial is a duel on a floating stage above Nanhou, before the Archonate's elders and half the empire's nobility.\n\nMy opponent is [ROOT.Char.Var('ac_ascension_rival').Char.GetTitledFirstName], whom the crowds have favoured since the heralds first rode."
 ac_ascend.0030.style:0 "Unleash my Martial Style"
 ac_ascend.0030.element:0 "Call on my elements"
 ac_ascend.0030.strength:0 "Meet them head-on with raw strength"
 ac_ascend.0030.yield:0 "Bow, and leave the stage with my honour intact"
 ac_ascend.0050.t:0 "The Trials Conclude"
 ac_ascend.0050.desc_admitted:0 "When the dust settles, an elder of the Archonate descends to the stage and fastens a jade token to my belt. I am a disciple of the most prestigious sect in the empire. Every eye in Nanhou follows me down the steps."
 ac_ascend.0050.desc_mention:0 "I did not take a place in the Archonate, but my name was read aloud among those who distinguished themselves. Sects across the empire will remember it."
 ac_ascend.0050.desc_eliminated:0 "The trials ended for me sooner than I hoped. I leave Nanhou poorer, wiser, and determined to return stronger."
 ac_ascend.0050.ok:0 "So ends the Heavenly Ascension Trials"
 ac_ascend.round.pass:0 "You pass the trial"
 ac_ascend.round.fail:0 "You falter"
 ac_ascend.duel.win:0 "You win the duel"
 ac_ascend.duel.loss:0 "You are defeated"
 ac_ascend.0010.surge:0 "Push my Fortitude Core to the limit"
 ac_ascend.0020.surge:0 "Push my Soul Core to the limit"
 ac_ascend.0030.surge:0 "Surge my Power and Agility Cores at once"
