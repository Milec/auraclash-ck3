l_english:
 trait_ac_potential:0 "Potential"
 trait_ac_potential_generic_desc:0 "Innate cultivation potential, revealed upon awakening. Limit delays increases in Core formation cost. Talent grants lifestyle experience and monthly prestige. Each has nine grades, grouped into Mortal, Earthly and Heavenly tiers."
 trait_ac_potential_desc:0 "Innate cultivation capacity, revealed through awakening.\n\n#V Limit: [ROOT.GetCharacter.Custom('AC_PotentialLimit')]#! — Core costs rise by 100 prestige every [ROOT.GetCharacter.MakeScope.ScriptValue('ac_core_cost_interval')|0] total dots. Next Core dot: [ROOT.GetCharacter.MakeScope.ScriptValue('ac_core_formation_cost')|0] prestige.\n#V Talent: [ROOT.GetCharacter.Custom('AC_PotentialTalent')]#! — [ROOT.GetCharacter.Custom('AC_PotentialTalentBonus')].\n\nEach aptitude is inherited separately. Rare reinforcement can raise a child into the next tier. The icon reflects the higher tier of the two aptitudes."
 trait_track_ac_potential_limit:0 "Limit"
 trait_track_ac_potential_talent:0 "Talent"
 trait_track_ac_potential_limit_desc:0 "Each further Core dot costs 100 more prestige after every full band of formed dots. Higher Limit makes these bands longer.\n\n#V Mortal#! — pips 1–3: 8 / 9 / 10 dots per band.\n#V Earthly#! — pips 4–6: 12 / 14 / 16 dots per band.\n#V Heavenly#! — pips 7–9: 20 / 24 / 32 dots per band."
 trait_track_ac_potential_talent_desc:0 "Talent increases lifestyle experience and monthly prestige.\n\n#V Mortal#! — pips 1–3.\n#V Earthly#! — pips 4–6.\n#V Heavenly#! — pips 7–9.\n\nHover a pip to see its exact grade and total bonuses."
 ac_potential_unrevealed:0 "Unrevealed"
 ac_potential_grade_1:0 "Mortal I"
 ac_potential_talent_bonus_1:0 "+5% lifestyle experience and +0.1 monthly prestige"
 ac_potential_limit_effect_1:0 "#V 8 formed Core dots per cost band.#!\nDots 1–8: #V 100#! prestige each.\nDots 9–16: #V 200#! prestige each.\nDots 17–24: #V 300#! prestige each.\nEach further band adds #V 100#! prestige per dot."
