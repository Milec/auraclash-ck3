l_english:
 trait_ac_potential:0 "Potential"
 trait_ac_potential_generic_desc:0 "Innate cultivation potential, revealed upon awakening. Limit sets the Mortal Limit on Aura Pressure. Talent speeds Aura Pressure and lifestyle experience and grants monthly prestige. Each has nine grades, grouped into Mortal, Earthly and Heavenly tiers."
 trait_ac_potential_desc:0 "Innate cultivation capacity, revealed through awakening.\n\n#V Limit: [ROOT.GetCharacter.Custom('AC_PotentialLimit')]#! — Mortal Limit #V [ROOT.GetCharacter.MakeScope.ScriptValue('ac_mortal_limit')|0]#! Aura Pressure (current: [ROOT.GetCharacter.MakeScope.ScriptValue('ac_aura_pressure_value')|0]). Above it, Aura Pressure gains are halved; above 1.5 times it, quartered.\n#V Talent: [ROOT.GetCharacter.Custom('AC_PotentialTalent')]#! — [ROOT.GetCharacter.Custom('AC_PotentialTalentBonus')].\n\nEach aptitude is inherited separately. Rare reinforcement can raise a child into the next tier. The icon reflects the higher tier of the two aptitudes."
 trait_track_ac_potential_limit:0 "Mortal Limit"
 trait_track_ac_potential_talent:0 "Talent"
 trait_track_ac_potential_limit_desc:0 "Aura Pressure gains are halved above this limit and quartered above 1.5 times it. Regions rich in natural aura raise it.\n\n#V Mortal#! — pips 1–3: 800 / 1,000 / 1,200 AP.\n#V Earthly#! — pips 4–6: 1,500 / 2,000 / 2,500 AP.\n#V Heavenly#! — pips 7–9: 3,500 / 5,000 / 8,000 AP."
 trait_track_ac_potential_talent_desc:0 "Talent increases lifestyle experience and monthly prestige.\n\n#V Mortal#! — pips 1–3.\n#V Earthly#! — pips 4–6.\n#V Heavenly#! — pips 7–9.\n\nHover a pip to see its exact grade and total bonuses."
 ac_potential_unrevealed:0 "Unrevealed"
 ac_potential_grade_1:0 "Mortal I"
 ac_potential_talent_bonus_1:0 "+5% Aura Pressure and lifestyle experience, +0.1 monthly prestige"
 ac_potential_limit_effect_1:0 "#V Mortal Limit 800 Aura Pressure.#!\nAbove 800 AP: gains halved.\nAbove 1,200 AP: gains quartered."
