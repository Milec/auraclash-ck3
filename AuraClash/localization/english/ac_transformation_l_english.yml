l_english:
 ac_train_transformation:0 "Train a Transformation"
 ac_train_transformation_desc_general:0 "Training a Transformation Technique: a stronger aura, built for battle, wrapped around the body."
 AC_TRAIN_TRANSFORMATION_SUCCESS_DESC:0 "Master the Transformation"
 AC_TF_SCHEME_MARTIAL:0 "My [martial|E]"
 AC_TF_SCHEME_STYLE:0 "Mastery of my Style"
 AC_TF_SCHEME_AURA:0 "Aura Pressure beyond the threshold"
 AC_TF_SCHEME_MASTER:0 "A master who knows the form"
 AC_TF_SCHEME_GATE:0 "Touched by a Heavenly Gate"
 ac_seek_tf_training_interaction:0 "Seek Transformation Training"
 ac_seek_tf_training_interaction_desc:0 "Train a Transformation Technique under [recipient.GetShortUIName], who has mastered it."
 ac_tf_pick_form_tt:0 "Choose a Transformation to learn"
 ac_train_tf_alone_interaction:0 "Train a Transformation"
 ac_train_tf_alone_interaction_desc:0 "Every Style hides a Transformation: a temporary aura built for battle. The way is long without a master, but it can be found. Choose a form and train it as a personal [scheme|E]."
 ac_tf_requirements_tt:0 "Requires the Immortal Core, 1,500 Aura Pressure and the form's Style (Limitbreaker: every Combat Core at 3+)."
 ac_tf.0001.t:0 "The Way of Transformation"
 ac_tf.0001.desc:0 "Transformation Techniques wrap a stronger aura around the body for a time, one built to bring out what my Style hides. Each Style has its own; Limitbreaker belongs to none. It needs the Immortal Core and 1,500 Aura Pressure."
 ac_tf.0001.cancel:0 "Not yet."
 ac_tf.0002.t:0 "Transformation!!"
 ac_tf.0002.a:0 "This power is mine."
 ac_tf.0003.t:0 "The Form Escapes Me"
 ac_tf.0003.desc:0 "The aura gathers, flares and tears loose before it can settle around me. Not yet."
 ac_tf.0003.a:0 "Meditate on what went wrong."
 ac_tf.0003.b:0 "Force it again, whatever it costs."
 ac_tf_malocchio_copied_tt:0 "Malocchio copied one of the foe's Techniques."
 trait_ac_tf_limitbreaker:0 "Limitbreaker"
 trait_ac_tf_limitbreaker_desc:0 "Freestyle Transformation: Limitbreaker. In a Clash of Auras this cultivator can transform for 1 Chi: +1 Power, +1 Health, and an Aura Pressure boost. Every Core Surge +1. +10 Aura Pressure from battle victories."
 ac_tf_option_limitbreaker:0 "Limitbreaker"
 ac_tf.0001.limitbreaker:0 "Freestyle Transformation: Limitbreaker (+1 Power, +1 Health)"
 ac_tf.0002.limitbreaker:0 "#bold Freestyle Transformation: Limitbreaker!!#!\n\nMy new aura explodes upward, three surging auras layered one over another. The constant surge of spiritual power soaks my hair in its colour."
 trait_ac_tf_reaper:0 "Reaper"
 trait_ac_tf_reaper_desc:0 "Bladed Transformation: Reaper. In a Clash of Auras this cultivator can transform for 1 Chi: +2 Power, +1 Agility, +1 Health, and an Aura Pressure boost. Doubled bonuses from a bladed weapon."
 ac_tf_option_reaper:0 "Reaper"
 ac_tf.0001.reaper:0 "Bladed Transformation: Reaper (+2 Power, +1 Agility, +1 Health)"
 ac_tf.0002.reaper:0 "#bold Bladed Transformation: Reaper!!#!\n\nTen swords of chi manifest in a circle behind me and fuse, one hammering gong at a time, into the blade in my hand. Reaper - Reijin Kengen."
 trait_ac_tf_godhand:0 "Godhand"
 trait_ac_tf_godhand_desc:0 "Aoyusumu Transformation: Godhand. In a Clash of Auras this cultivator can transform for 1 Chi: +1 Soul, +1 Agility, +1 Fortitude, +1 Health, +1 Chi, and an Aura Pressure boost. Heals to full Vitality upon transforming."
 ac_tf_option_godhand:0 "Godhand"
 ac_tf.0001.godhand:0 "Aoyusumu Transformation: Godhand (+1 Soul, +1 Agility, +1 Fortitude, +1 Health, +1 Chi)"
 ac_tf.0002.godhand:0 "#bold Aoyusumu Transformation: Godhand!!#!\n\nA halo of kinetic chi forms over my head, two smaller ones over my wrists, and blasts of Sacred energy flatten into wings of pure chi."
 trait_ac_tf_soul_domain:0 "Soul Domain"
 trait_ac_tf_soul_domain_desc:0 "Kiihakai Transformation: Soul Domain. In a Clash of Auras this cultivator can transform for 1 Chi: +2 Soul, +1 Power, +2 Chi, and an Aura Pressure boost. All attack types are Focused within the Soul Domain (+1 to every roll)."
 ac_tf_option_soul_domain:0 "Soul Domain"
 ac_tf.0001.soul_domain:0 "Kiihakai Transformation: Soul Domain (+2 Soul, +1 Power, +2 Chi)"
 ac_tf.0002.soul_domain:0 "#bold Kiihakai Transformation: Soul Domain!!#!\n\nMy fingers interlock in a complex handseal that releases the chains holding my inner world at bay. The world around me becomes my Soul Domain."
 trait_ac_tf_malocchio:0 "Malocchio"
 trait_ac_tf_malocchio_desc:0 "Kurokonton Transformation: Malocchio. In a Clash of Auras this cultivator can transform for 1 Chi: +2 Agility, +1 Fortitude, +1 Chi, and an Aura Pressure boost. Technique Copy: a victory teaches a Technique of the foe's."
 ac_tf_option_malocchio:0 "Malocchio"
 ac_tf.0001.malocchio:0 "Kurokonton Transformation: Malocchio (+2 Agility, +1 Fortitude, +1 Chi)"
 ac_tf.0002.malocchio:0 "#bold Kurokonton Transformation: Malocchio!!#!\n\nMy eyes descend into the abyssal yin: pitch black voids, and within them rings of burning purple irises. Every Technique I see can be mine."
 trait_ac_tf_titan:0 "Titan"
 trait_ac_tf_titan_desc:0 "Midorikatai Transformation: Titan. In a Clash of Auras this cultivator can transform for 1 Chi: +2 Fortitude, +1 Power, +2 Health, and an Aura Pressure boost. Always deals bonus damage (+1 on every hit)."
 ac_tf_option_titan:0 "Titan"
 ac_tf.0001.titan:0 "Midorikatai Transformation: Titan (+2 Fortitude, +1 Power, +2 Health)"
 ac_tf.0002.titan:0 "#bold Midorikatai Transformation: Titan!!#!\n\nWild Chi pumps through my veins. Skin, muscle and bone tear and expand a hundred-fold until I stand sixty feet tall."
 trait_ac_tf_asura:0 "Asura"
 trait_ac_tf_asura_desc:0 "Midorikatai Transformation: Asura. In a Clash of Auras this cultivator can transform for 1 Chi: +2 Power, +1 Fortitude, +1 Health, and an Aura Pressure boost. Melee attacks are always Focused (+1 to Power Strike, Iron Guard and Flash Step)."
 ac_tf_option_asura:0 "Asura"
 ac_tf.0001.asura:0 "Midorikatai Transformation: Asura (+2 Power, +1 Fortitude, +1 Health)"
 ac_tf.0002.asura:0 "#bold Midorikatai Transformation: Asura!!#!\n\nWild Chi pumps through my blood like an animal. I grow larger than ever, and a second set of arms rips out from behind my shoulder blades."
