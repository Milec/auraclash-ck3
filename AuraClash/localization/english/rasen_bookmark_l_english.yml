l_english:
 bm_group_rasen:0 "Imperial Rasen"
 bm_rasen_trials:0 "The Heavenly Ascension Trials"
 bm_rasen_trials_desc:0 "The war in the north is won, and the Exalted Council has chosen the Outer West town of Nanhou to host the next Heavenly Ascension Trials. Ten thousand young martial artists converge on it, and the five Exalts watch for those worth claiming."
 bm_rasen_azuma:0 "Haruka"
 bm_rasen_azuma_desc:0 "High Steward of the Exalted Council (generated). Azuma Honsha has had no Emperor for centuries; the Steward keeps the capital for the Council."
 bm_rasen_sacred:0 "Seiren"
 bm_rasen_sacred_desc:0 "High Saint of the Devanic Temple (generated), who rules the Sacred Lands from its temples and may call a Crusade."
 bm_rasen_mystic:0 "Zhiyuan"
 bm_rasen_mystic_desc:0 "Grand Archivist of the Mystic Lands (generated). Appointed governors run the white limestone cities in his name, and only he may open the Forbidden Library."
 bm_rasen_cursed:0 "Shinobu"
 bm_rasen_cursed_desc:0 "Lord of the Kurogane, first among the Cursed clans (generated). The Shinobi Clans keep his peace from the shadows."
 bm_rasen_bladed:0 "Kagemitsu"
 bm_rasen_bladed_desc:0 "Shogun of the Bladed Lands (generated). The samurai of the five Bladed houses answer to the Shogun, not to their Exalt."
 bm_rasen_wild:0 "Gorou"
 bm_rasen_wild_desc:0 "The strongest of the thirteen Maos of the Wild Lands (generated). No one rules the Wild Lands: each Mao runs a faction, and each city is a fair target for the others."
