l_english:
 bm_group_rasen:0 "Imperial Rasen"
 bm_rasen_trials:0 "The Heavenly Ascension Trials"
 bm_rasen_trials_desc:0 "The war in the north is won, and the Exalted Council has chosen the Outer West town of Nanhou to host the next Heavenly Ascension Trials. Ten thousand young martial artists converge on it, and the five Exalts watch for those worth claiming."
 bm_rasen_sacred:0 "Amane"
 bm_rasen_sacred_desc:0 "The Sacred Exalt (generated), a Saint of the Devanic Temple who values mercy to the innocent and retribution upon the wicked."
 bm_rasen_mystic:0 "Wenyao"
 bm_rasen_mystic_desc:0 "The Mystic Exalt (generated). A master of Kiihakai who rules from cities of endless daylight and flying towers."
 bm_rasen_cursed:0 "Kagerou"
 bm_rasen_cursed_desc:0 "The Cursed Exalt (generated), of the great Ozaki shinobi clan. Their strike teams already move among the Trials."
 bm_rasen_bladed:0 "Masaru"
 bm_rasen_bladed_desc:0 "The Bladed Exalt. Father of twenty-three sons and one daughter, master of Akakiru and of a nation of samurai."
 bm_rasen_wild:0 "Tetsuo"
 bm_rasen_wild_desc:0 "The Wild Exalt (generated). A warrior-king who rules by strength and has taken an interest in the Trials at Nanhou."
 bm_rasen_azuma:0 "Haruka"
 bm_rasen_azuma_desc:0 "High Steward of the Exalted Council (generated). Azuma Honsha has had no Emperor for centuries; the Steward keeps the capital for the Council."
