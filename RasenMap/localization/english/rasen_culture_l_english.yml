l_english:
 zenshin:0 "Zenshin"
 zenshin_prefix:0 "Zen"
 zenshin_collective_noun:0 "Zenshin"
 zenshin_desc:0 "The people of Imperial Rasen, descended from Cathayan settlers. For three millennia the katana has set Zenshin warriors apart from their Cathayan forebears."
 cathayan:0 "Cathayan"
 cathayan_prefix:0 "Cathay"
 cathayan_collective_noun:0 "Cathayans"
 cathayan_desc:0 "Heirs of the Cathayan Empire, shattered by the Calamity. Their hanfu robes, qiang and jian survive across the Mystic and Sacred Lands."
 oni:0 "Oni"
 oni_prefix:0 "Oni"
 oni_collective_noun:0 "Oni"
 oni_desc:0 "Spirits who longed for a human form. Oni are horned, often red-skinned, and formidable in body."
 yokai:0 "Yokai"
 yokai_prefix:0 "Yokai"
 yokai_collective_noun:0 "Yokai"
 yokai_desc:0 "Beasts who longed for a human form: wolf, monkey and stranger kin. Many roam the Wild Lands, where strength alone earns respect."
 lunargoth:0 "Lunargoth"
 lunargoth_prefix:0 "Luna"
 lunargoth_collective_noun:0 "Lunargoths"
 lunargoth_desc:0 "Fair-haired northerners of Outer North who fill the Northern Army. They answer to the Divine General, call him Emperor of all ten Provinces, and treat boons and debts as cowardice."
 kitsune:0 "Kitsune"
 kitsune_prefix:0 "Kitsune"
 kitsune_collective_noun:0 "Kitsune"
 kitsune_desc:0 "The rarest people of Rasen: part beast, part spirit, part human. Many sects treat Kitsune as trickster spirits rather than a race."
 ryugujin:0 "Ryugujin"
 ryugujin_prefix:0 "Ryugu"
 ryugujin_collective_noun:0 "Ryugujin"
 ryugujin_desc:0 "The people of Ryugujo, whose draconic dome-cities lie beneath the sea southeast of Imperial Rasen. Each city-state is ruled from the seat of a Dragon Prince."
