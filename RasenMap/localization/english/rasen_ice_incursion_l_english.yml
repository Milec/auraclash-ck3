l_english:
 rasen_ice.0001.t:0 "The Ice Incursion"
 rasen_ice.0001.desc:0 "The calm has broken. Out of the land of ice and snow beyond Outer North, malignant ice and yin spirits have formed into demonic elemental hordes, and they are pouring across the frozen coast. The Northern Army of the Divine General is marching, and the Exalted Council will send Archons, as it does for every Incursion.\n\nThe front will not hold itself."
 rasen_ice.0001.march:0 "I will take my place on the front lines"
 rasen_ice.0001.fund:0 "Send gold and supplies to the Northern Army"
 rasen_ice.0001.fortify:0 "Hold my own walls and let others bleed"
 rasen_ice.0002.t:0 "The Council Sends Its Archons"
 rasen_ice.0002.desc:0 "An Imperial clerk delivers the summons in person. Another Ice Incursion has struck Outer North, and the Exalted Council sends a number of Archons to every Incursion. As a disciple of the Archonate, my name is on the list."
 rasen_ice.0002.answer:0 "Ride north"
 rasen_ice.0002.refuse:0 "Find a reason to stay"
 rasen_ice.0010.t:0 "The Ice Front"
 rasen_ice.0010.desc:0 "On the front lines of Outer North, the legalism of the south means nothing; boons and debts are for cowards. The demons come out of the blizzard in waves of living ice, and the Northern Army meets them shoulder to shoulder."
 rasen_ice.0010.fight:0 "Hold the line"
 rasen_ice.0010.surge:0 "Push my Fortitude Core to the limit"
 rasen_ice.0010.victory:0 "The horde breaks against you"
 rasen_ice.0010.defeat:0 "You are carried from the line, wounded"
 rasen_ice.0020.t:0 "The Incursion Breaks"
 rasen_ice.0020.desc:0 "The last of the ice demons have melted back into the north. Outer North can expect twenty or thirty years of calm, civilian life before the next Incursion. The Divine General will already be replenishing his armies."
 rasen_ice.0020.ok:0 "Until the next one"
 rasen_ice_front_tt:0 "Spend the season on the ice front. A slain ice demon yields a #V Soul Treasure#! (1,500 Aura Pressure)."
 rasen_ice_incursion_county_modifier:0 "Ice Incursion"
 rasen_ice_incursion_county_modifier_desc:0 "Demonic elemental hordes from the frozen north are raiding this county."
 rasen_ice_war_veteran_modifier:0 "Veteran of the Ice War"
 rasen_ice_war_veteran_modifier_desc:0 "Held the line against the ice demons of Outer North."
 trait_rasen_divine_general:0 "Divine General"
 trait_rasen_divine_general_desc:0 "Supreme commander of the Northern Army, Emperor of all ten Provinces in the eyes of those who serve him on the front lines, and savior of humanity in the never-ending Ice Incursions. The Exalted Council calls him its northern steward."
